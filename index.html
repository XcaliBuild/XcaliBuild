<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pages. Sources</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,600;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Roboto:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-app: #1e1e24; 
            --bg-ribbon: #2b2b36;
            --bg-sidebar: #25252f;
            --text-ui: #ffffff;
            --text-muted: #9ca3af;
            --border-color: #3f3f4e;
            --sheet-bg: #ffffff; --sheet-text: #111111;
            --accent: #06b6d4;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-app); color: var(--text-ui); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* RUBAN */
        .ribbon { width: 100%; height: 70px; background-color: var(--bg-ribbon); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; }
        .ribbon-left { display: flex; align-items: center; gap: 30px; }
        .ribbon-right { display: flex; align-items: center; gap: 12px; }
        
        .logo-container { display: flex; flex-direction: column; line-height: 1.1; }
        .logo-text { font-family: 'Newsreader', serif; font-size: 24px; font-weight: 700; font-style: italic; color: #ffffff; letter-spacing: -0.5px; }
        .logo-text span { color: var(--accent); font-family: 'Inter', sans-serif; font-size: 12px; font-style: normal; text-transform: uppercase; letter-spacing: 1px; margin-left: 8px;}
        
        .toolbar { display: flex; align-items: center; gap: 10px; border-left: 1px solid var(--border-color); padding-left: 20px; }
        .toolbar-divider { width: 1px; height: 30px; background-color: var(--border-color); margin: 0 5px; }
        
        select, .btn { background: var(--bg-app); color: var(--text-ui); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; outline: none; }
        .btn:hover { background: #3f3f4e; }
        .btn-icon { padding: 8px; border-radius: 6px; width: 34px; height: 34px; justify-content: center; }
        
        .btn-green { background: #10b981; color: white; border: none; } .btn-green:hover { background: #059669; }
        .btn-blue { color: #3b82f6; border-color: rgba(59, 130, 246, 0.4); } .btn-blue:hover { background: rgba(59, 130, 246, 0.1); border-color: #3b82f6; }
        .btn-danger { color: #ef4444; } .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }
        
        /* Indicateur Sync (Réduit et discret) */
        .sync-indicator { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; padding-right: 10px;}
        .sync-indicator i { font-size: 11px; }
        .sync-indicator.synced i { color: #10b981; }
        .sync-indicator.saving i { color: #f59e0b; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* CORPS & SIDEBAR */
        .main-body { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 240px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }
        .menu-category { font-size: 11px; text-transform: uppercase; color: var(--text-muted); padding: 15px 20px 5px 20px; letter-spacing: 1px; font-weight: 700; }
        .menu-item { padding: 10px 20px; display: flex; align-items: center; gap: 12px; color: var(--text-muted); cursor: pointer; transition: 0.2s; font-size: 13px; font-weight: 500; border-left: 3px solid transparent; }
        .menu-item:hover { color: var(--text-ui); background: rgba(255,255,255,0.03); }
        .menu-item.active { color: var(--accent); background: rgba(6, 182, 212, 0.05); border-left: 3px solid var(--accent); }

        /* WORKSPACES */
        .workspace { flex: 1; background-color: #17171c; padding: 40px 20px; overflow-y: auto; display: none; justify-content: center; align-items: flex-start; position: relative; }
        .workspace.active { display: flex; }
        
        .writing-sheet { width: 100%; max-width: 800px; background: var(--sheet-bg); color: var(--sheet-text); border-radius: 8px; padding: 50px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 24px; position: relative;}
        
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #888; font-weight: 700; font-family: 'Inter', sans-serif; }
        
        input.meta-input, select.meta-input { background: rgba(128,128,128,0.08); border: 1px solid rgba(128,128,128,0.2); color: inherit; font-family: 'Inter', sans-serif; font-size: 14px; padding: 12px; border-radius: 6px; outline: none; width: 100%; }
        input.meta-input:focus { border-color: var(--accent); }
        
        textarea.main-textarea { width: 100%; flex: 1; min-height: 400px; background: transparent; border: 1px solid rgba(128,128,128,0.2); border-radius: 6px; padding: 20px; color: inherit; font-family: inherit; font-size: 17px; line-height: 1.7; resize: vertical; outline: none; transition: 0.2s; }
        textarea.main-textarea:focus { border-color: var(--accent); }
        
        .meta-row { display: flex; gap: 20px; flex-wrap: wrap; }
        .meta-row .input-group { flex: 1; min-width: 250px; }

        /* Segments Layout Image */
        .segment-group { display: flex; background: rgba(128,128,128,0.08); border-radius: 6px; padding: 4px; border: 1px solid rgba(128,128,128,0.2); }
        .segment-btn { flex: 1; background: transparent; color: #666; border: none; padding: 8px 5px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 4px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .segment-btn.active { background: var(--accent); color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Font Cards in Config */
        .font-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .font-card { border: 1px solid var(--border-color); background: var(--bg-app); padding: 20px; border-radius: 8px; cursor: pointer; transition: 0.2s; text-align: center; }
        .font-card:hover { border-color: var(--text-muted); }
        .font-card.active { border-color: var(--accent); background: rgba(6, 182, 212, 0.05); }
        .font-card h4 { font-size: 24px; margin-bottom: 5px; }
        .font-card span { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }

        /* PREVIEW MODAL */
        .btn-preview { position: fixed; bottom: 30px; right: 40px; background: var(--accent); color: white; border: none; padding: 15px 25px; border-radius: 30px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 10px 20px rgba(6, 182, 212, 0.3); display: flex; align-items: center; gap: 10px; transition: 0.2s; z-index: 100;}
        .btn-preview:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(6, 182, 212, 0.4); }

        .preview-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .preview-overlay.active { display: flex; }
        
        .preview-container { background: var(--bg-ribbon); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; border: 1px solid var(--border-color); max-height: 95vh; }
        .preview-controls { display: flex; gap: 10px; background: var(--bg-app); padding: 5px; border-radius: 8px; }
        .preview-controls button { background: transparent; border: none; color: var(--text-muted); padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .preview-controls button.active { background: var(--border-color); color: white; }
        
        .preview-screen { background: #faf8f5; border-radius: 12px; overflow-y: auto; overflow-x: hidden; position: relative; transition: width 0.3s, height 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .preview-screen.mobile { width: 375px; height: 667px; }
        .preview-screen.tablet { width: 768px; height: 800px; }
        .preview-screen.pc { width: 1024px; height: 700px; }

        /* Preview Content Styles */
        .prv-content { padding: 30px; color: #111; font-size: 18px; line-height: 1.6; }
        .prv-title { font-size: 2em; font-weight: bold; margin-bottom: 20px; line-height: 1.2; }
        .prv-img { width: 100%; border-radius: 8px; margin-bottom: 20px; object-fit: cover; }
        .prv-img.bg-mode { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.3; border-radius: 0; }
        .prv-text { position: relative; z-index: 1; white-space: pre-wrap;}
    </style>
</head>
<body>

    <!-- RUBAN DU HAUT -->
    <div class="ribbon">
        <div class="ribbon-left">
            <div class="logo-container">
                <div class="logo-text">The Pages.<span>Sources</span></div>
            </div>
            
            <div class="toolbar" id="mainToolbar">
                <select id="pageSelector" onchange="loadPageData()"></select>
                <button class="btn" onclick="addPage()"><i class="fas fa-plus"></i> <span data-i18n="newBtn">Page</span></button>
                <button class="btn btn-icon btn-danger" onclick="deletePage()" title="Supprimer"><i class="fas fa-trash"></i></button>
                <div class="toolbar-divider"></div>
                <button class="btn" onclick="toggleLang()" id="langBtn">EN</button>
            </div>
        </div>
        
        <div class="ribbon-right">
            <!-- INDICATEUR DE SYNCHRONISATION -->
            <div class="sync-indicator synced" id="syncIndicator">
                <i class="fas fa-sync-alt"></i><span id="syncText">Sync</span>
            </div>
            
            <div class="toolbar-divider" style="height:30px;"></div>

            <input type="file" id="importWorkInput" accept=".writerwork,.json" style="display:none" onchange="importWorkflow(event)">
            <button class="btn" onclick="document.getElementById('importWorkInput').click()" title="Importer"><i class="fas fa-folder-open"></i> Import</button>
            <button class="btn" onclick="exportWorkflow()" title="Backup Local"><i class="fas fa-archive"></i> Backup</button>
            <button class="btn btn-blue" onclick="manualSave()"><i class="fas fa-save"></i> Save</button>
            
            <div class="toolbar-divider" style="height:30px;"></div>

            <button class="btn btn-green" onclick="exportPagesData()"><i class="fas fa-download"></i> pages.data</button>
        </div>
    </div>

    <div class="main-body">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="menu-category" data-i18n="catConfig">Configuration</div>
            <div class="menu-item" id="tab-config" onclick="setMode('config')"><i class="fas fa-cog"></i> <span data-i18n="menuConfig">Paramètres App</span></div>
            
            <div class="menu-category" data-i18n="catReading">Lecture</div>
            <div class="menu-item active" id="tab-book" onclick="setMode('book')"><i class="fas fa-book"></i> <span data-i18n="menuBook">Livre (Poche)</span></div>
            <div class="menu-item" id="tab-bd" onclick="setMode('bd')"><i class="fas fa-mask"></i> <span data-i18n="menuBd">Bande Dessinée</span></div>
            <div class="menu-item" id="tab-enfant" onclick="setMode('enfant')"><i class="fas fa-child"></i> <span data-i18n="menuKid">Livre Enfant</span></div>
            
            <div class="menu-category" data-i18n="catEdition">Éditions</div>
            <div class="menu-item" id="tab-magazine" onclick="setMode('magazine')"><i class="fas fa-th-large"></i> <span data-i18n="menuMag">Magazine</span></div>
            <div class="menu-item" id="tab-journal" onclick="setMode('journal')"><i class="far fa-newspaper"></i> <span data-i18n="menuNews">Journal</span></div>
        </div>

        <!-- WORKSPACE : ÉDITEUR DE TEXTE -->
        <div class="workspace active" id="ws-editor">
            <div class="writing-sheet">
                <div class="meta-row">
                    <div class="input-group">
                        <label data-i18n="lblPageTitle">Titre de la page</label>
                        <input type="text" id="itemTitle" class="meta-input" style="font-size: 18px; font-weight:bold; font-family:'Newsreader';" oninput="autoSave()">
                    </div>
                </div>

                <div class="meta-row">
                    <div class="input-group" style="flex:2;">
                        <label data-i18n="lblImage">URL de l'image</label>
                        <input type="text" id="itemImage" class="meta-input" placeholder="https://..." oninput="autoSave()">
                    </div>
                    <div class="input-group" style="flex:1;">
                        <label data-i18n="lblLayout">Position Image</label>
                        <div class="segment-group">
                            <button class="segment-btn active" id="lay-top" onclick="setLayout('top')"><i class="fas fa-arrow-up"></i> Haut</button>
                            <button class="segment-btn" id="lay-bottom" onclick="setLayout('bottom')"><i class="fas fa-arrow-down"></i> Bas</button>
                            <button class="segment-btn" id="lay-bg" onclick="setLayout('bg')"><i class="fas fa-image"></i> Fond</button>
                        </div>
                    </div>
                </div>

                <div class="input-group" style="flex:1;">
                    <label data-i18n="lblText">Contenu</label>
                    <textarea id="itemText" class="main-textarea" placeholder="..." oninput="autoSave()"></textarea>
                </div>
            </div>
            
            <!-- BOUTON PREVIEW FLOTTANT -->
            <button class="btn-preview" onclick="openPreview()"><i class="fas fa-eye"></i> <span data-i18n="btnPreview">Aperçu</span></button>
        </div>

        <!-- WORKSPACE : CONFIGURATION APP -->
        <div class="workspace" id="ws-config">
            <div class="writing-sheet" style="background: var(--bg-ribbon); color: var(--text-ui); border: 1px solid var(--border-color);">
                <h2 style="font-family:'Inter'; margin-bottom: 10px; font-size:20px;" data-i18n="cfgTitle">Paramètres de votre Application</h2>
                
                <div class="input-group">
                    <label data-i18n="lblAppTitle">Nom du Livre / Projet</label>
                    <input type="text" id="globalTitle" class="meta-input" placeholder="Ex: Mon Chef-d'œuvre" style="background: var(--bg-app); color: white;" oninput="saveConfig()">
                </div>

                <div class="input-group">
                    <label data-i18n="cfgLogo">Logo de l'application (URL Image)</label>
                    <input type="text" id="appLogo" class="meta-input" placeholder="https://..." style="background: var(--bg-app); color: white;" oninput="saveConfig()">
                </div>

                <div class="input-group" style="margin-top: 20px;">
                    <label data-i18n="cfgFont">Police de caractère par défaut</label>
                    <div class="font-grid">
                        <div class="font-card active" id="font-Newsreader" onclick="selectAppFont('Newsreader')">
                            <h4 style="font-family: 'Newsreader', serif;">Ag</h4><span>Newsreader</span>
                        </div>
                        <div class="font-card" id="font-Inter" onclick="selectAppFont('Inter')">
                            <h4 style="font-family: 'Inter', sans-serif;">Ag</h4><span>Inter</span>
                        </div>
                        <div class="font-card" id="font-Lora" onclick="selectAppFont('Lora')">
                            <h4 style="font-family: 'Lora', serif;">Ag</h4><span>Lora</span>
                        </div>
                        <div class="font-card" id="font-Courier Prime" onclick="selectAppFont('Courier Prime')">
                            <h4 style="font-family: 'Courier Prime', monospace;">Ag</h4><span>Courier</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PREVIEW MODAL -->
    <div class="preview-overlay" id="previewModal">
        <div class="preview-container">
            <div class="preview-controls">
                <button class="active" onclick="setPreviewSize('mobile', this)"><i class="fas fa-mobile-alt"></i></button>
                <button onclick="setPreviewSize('tablet', this)"><i class="fas fa-tablet-alt"></i></button>
                <button onclick="setPreviewSize('pc', this)"><i class="fas fa-desktop"></i></button>
                <button onclick="closePreview()" style="margin-left: 20px; color: #ef4444;"><i class="fas fa-times"></i></button>
            </div>
            <div class="preview-screen mobile" id="previewScreen">
                <div class="prv-content" id="prvContent"></div>
            </div>
        </div>
    </div>

    <script>
        // --- DICTIONNAIRES ---
        const i18n = {
            fr: {
                catConfig: "Configuration", menuConfig: "Paramètres App", cfgTitle: "Paramètres de votre Application", cfgLogo: "Logo de l'application (URL)", cfgFont: "Police par défaut",
                catReading: "Lecture", menuBook: "Livre (Poche)", menuBd: "Bande Dessinée", menuKid: "Livre Enfant",
                catEdition: "Éditions", menuMag: "Magazine", menuNews: "Journal",
                newBtn: "Page", btnPreview: "Aperçu de la page",
                lblAppTitle: "Nom du Livre / Projet", lblPageTitle: "Titre de la page", lblImage: "URL de l'image", lblLayout: "Position Image", lblText: "Contenu du texte"
            },
            en: {
                catConfig: "Configuration", menuConfig: "App Settings", cfgTitle: "Application Settings", cfgLogo: "App Logo (URL)", cfgFont: "Default Font",
                catReading: "Reading", menuBook: "Pocket Book", menuBd: "Comic Book", menuKid: "Children's Book",
                catEdition: "Publishing", menuMag: "Magazine", menuNews: "Newspaper",
                newBtn: "Page", btnPreview: "Page Preview",
                lblAppTitle: "Book / Project Name", lblPageTitle: "Page Title", lblImage: "Image URL", lblLayout: "Image Layout", lblText: "Text Content"
            }
        };

        const fontMapping = {
            'Newsreader': "'Newsreader', serif", 'Inter': "'Inter', sans-serif",
            'Courier Prime': "'Courier Prime', monospace", 'Lora': "'Lora', serif"
        };

        let currentLang = 'fr';
        let appConfig = { appName: '', logoUrl: '', fontFamily: 'Newsreader' };
        
        let appData = {
            book: { items: [{ id: '1', title: 'Chapitre 1', image: '', layout: 'top', text: 'Il était une fois...' }] },
            bd: { items: [{ id: '1', title: 'Planche 1', image: '', layout: 'top', text: '' }] },
            magazine: { items: [{ id: '1', title: 'Article 1', image: '', layout: 'top', text: '' }] },
            journal: { items: [{ id: '1', title: 'News 1', image: '', layout: 'top', text: '' }] },
            enfant: { items: [{ id: '1', title: 'Page 1', image: '', layout: 'top', text: '' }] }
        };

        let currentMode = 'book';
        let currentPageId = '1';
        let saveTimeout = null;

        // --- SYNCHRONISATION ---
        function setSyncStatus(status) {
            const indicator = document.getElementById('syncIndicator');
            indicator.className = 'sync-indicator ' + status;
        }

        // --- UI & MODES ---
        function setMode(mode) {
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + mode).classList.add('active');
            
            if(mode === 'config') {
                document.getElementById('ws-editor').classList.remove('active');
                document.getElementById('ws-config').classList.add('active');
                document.getElementById('mainToolbar').style.visibility = 'hidden';
                loadConfigUI();
            } else {
                currentMode = mode;
                document.getElementById('ws-config').classList.remove('active');
                document.getElementById('ws-editor').classList.add('active');
                document.getElementById('mainToolbar').style.visibility = 'visible';
                refreshSelector();
            }
        }

        function refreshSelector() {
            const selector = document.getElementById('pageSelector');
            selector.innerHTML = '';
            const items = appData[currentMode].items;
            
            items.forEach((item, index) => {
                const opt = document.createElement('option');
                opt.value = item.id;
                opt.text = item.title || `Page ${index + 1}`;
                selector.appendChild(opt);
            });
            
            if(!items.find(i => i.id === currentPageId) && items.length > 0) currentPageId = items[0].id;
            if(currentPageId) { selector.value = currentPageId; loadPageData(); }
        }

        function loadPageData() {
            const item = appData[currentMode].items.find(i => i.id === currentPageId);
            if(!item) return;
            
            document.getElementById('itemTitle').value = item.title || '';
            document.getElementById('itemImage').value = item.image || '';
            document.getElementById('itemText').value = item.text || '';
            document.getElementById('itemText').style.fontFamily = fontMapping[appConfig.fontFamily] || fontMapping['Newsreader'];
            
            setLayout(item.layout || 'top', false);
        }

        function setLayout(layoutStr, doSave = true) {
            document.querySelectorAll('.segment-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('lay-' + layoutStr).classList.add('active');
            if(doSave) autoSave();
        }

        function autoSave() {
            if(!currentPageId || currentMode === 'config') return;
            setSyncStatus('saving');
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                let item = appData[currentMode].items.find(i => i.id === currentPageId);
                if(item) {
                    item.title = document.getElementById('itemTitle').value;
                    item.image = document.getElementById('itemImage').value;
                    item.text = document.getElementById('itemText').value;
                    item.layout = document.querySelector('.segment-btn.active').id.replace('lay-', '');
                    
                    const opt = document.getElementById('pageSelector').querySelector(`option[value="${currentPageId}"]`);
                    if(opt) opt.text = item.title || `Page`;
                }
                saveSession();
            }, 500);
        }

        function addPage() {
            const newId = 'page_' + Date.now();
            appData[currentMode].items.push({ id: newId, title: `Nouvelle Page`, image: '', layout: 'top', text: '' });
            currentPageId = newId;
            saveSession(); refreshSelector();
        }

        function deletePage() {
            if(appData[currentMode].items.length <= 1) return;
            appData[currentMode].items = appData[currentMode].items.filter(i => i.id !== currentPageId);
            saveSession(); refreshSelector();
        }

        // --- CONFIGURATION TAB ---
        function loadConfigUI() {
            document.getElementById('globalTitle').value = appConfig.appName || '';
            document.getElementById('appLogo').value = appConfig.logoUrl || '';
            selectAppFont(appConfig.fontFamily || 'Newsreader', false);
        }

        function saveConfig() {
            setSyncStatus('saving');
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                appConfig.appName = document.getElementById('globalTitle').value;
                appConfig.logoUrl = document.getElementById('appLogo').value;
                saveSession();
            }, 500);
        }

        function selectAppFont(fontName, doSave = true) {
            document.querySelectorAll('.font-card').forEach(c => c.classList.remove('active'));
            const card = document.getElementById('font-' + fontName);
            if(card) card.classList.add('active');
            
            appConfig.fontFamily = fontName;
            if(doSave) saveConfig();
        }

        // --- PREVIEW (APERÇU) ---
        function openPreview() {
            autoSave();
            const item = appData[currentMode].items.find(i => i.id === currentPageId);
            if(!item) return;

            const modal = document.getElementById('previewModal');
            const contentBox = document.getElementById('prvContent');
            const fontCSS = fontMapping[appConfig.fontFamily] || fontMapping['Newsreader'];
            
            contentBox.style.fontFamily = fontCSS;
            let html = `<div class="prv-title">${item.title}</div>`;
            
            const imgHTML = item.image ? `<img src="${item.image}" class="prv-img ${item.layout === 'bg' ? 'bg-mode' : ''}">` : '';
            const txtHTML = `<div class="prv-text">${item.text}</div>`;

            if(item.layout === 'top' || item.layout === 'bg') {
                html += imgHTML + txtHTML;
            } else if (item.layout === 'bottom') {
                html += txtHTML + imgHTML;
            }

            contentBox.innerHTML = html;
            modal.classList.add('active');
        }

        function closePreview() { document.getElementById('previewModal').classList.remove('active'); }
        
        function setPreviewSize(size, btn) {
            document.querySelectorAll('.preview-controls button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const screen = document.getElementById('previewScreen');
            screen.className = 'preview-screen ' + size;
        }

        // --- GESTION DES FICHIERS & SESSION ---
        function saveSession() {
            localStorage.setItem('writer_sources_v5', JSON.stringify({ data: appData, config: appConfig }));
            setSyncStatus('synced');
        }

        function manualSave() { autoSave(); saveSession(); }

        function loadSession() {
            const saved = localStorage.getItem('writer_sources_v5');
            if(saved) {
                try {
                    const parsed = JSON.parse(saved);
                    appData = parsed.data || appData;
                    appConfig = parsed.config || appConfig;
                } catch(e) {}
            }
            setMode('book');
        }

        function exportWorkflow() {
            autoSave(); saveSession();
            const blob = new Blob([JSON.stringify({ data: appData, config: appConfig }, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a"); a.href = url; a.download = "projet.writerwork";
            a.click(); URL.revokeObjectURL(url);
        }

        function importWorkflow(event) {
            const file = event.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if(parsed.data && parsed.config) {
                        appData = parsed.data; appConfig = parsed.config;
                        saveSession(); setMode('book');
                    }
                } catch(err) { alert("Fichier invalide."); }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function exportPagesData() {
            autoSave(); saveSession();
            const exportObj = {
                format: currentMode, langue: currentLang,
                config: { appName: appConfig.appName, logo: appConfig.logoUrl, fontCSS: fontMapping[appConfig.fontFamily] },
                items: appData[currentMode].items
            };
            const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a"); a.href = url; a.download = "pages.data";
            a.click(); URL.revokeObjectURL(url);
        }

        function toggleLang() {
            currentLang = currentLang === 'fr' ? 'en' : 'fr';
            document.getElementById('langBtn').innerText = currentLang === 'fr' ? 'EN' : 'FR';
            document.querySelectorAll('[data-i18n]').forEach(el => { el.innerText = i18n[currentLang][el.getAttribute('data-i18n')]; });
            refreshSelector();
        }

        window.onload = loadSession;
    </script>
</body>
</html>
