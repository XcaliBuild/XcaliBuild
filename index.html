<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Studio Pages.</title>
    <!-- Nouvelles Polices intégrées -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,600;1,400&family=Courier+Prime&family=Lora&family=Merriweather&family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Couleurs de l'interface du logiciel (Fixes) */
            --bg-app: #1e1e24; 
            --bg-ribbon: #2b2b36;
            --bg-sidebar: #25252f;
            --text-ui: #ffffff;
            --text-muted: #9ca3af;
            --border-color: #3f3f4e;
            
            /* Couleurs de la feuille d'écriture (Dynamiques avec le thème) */
            --sheet-bg-clair: #ffffff; --sheet-text-clair: #111111;
            --sheet-bg-sombre: #121212; --sheet-text-sombre: #e0e0e0;
            --sheet-bg-papier: #f4ecd8; --sheet-text-papier: #433422;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-app); color: var(--text-ui); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* --- RUBAN TYPE MICROSOFT OFFICE (EN HAUT) --- */
        .ribbon { width: 100%; height: 70px; background-color: var(--bg-ribbon); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; }
        
        .ribbon-left { display: flex; align-items: center; gap: 30px; }
        .logo-text { font-family: 'Newsreader', serif; font-size: 24px; font-weight: 700; font-style: italic; color: cyan; letter-spacing: -0.5px; }
        
        .toolbar { display: flex; align-items: center; gap: 10px; border-left: 1px solid var(--border-color); padding-left: 20px; }
        .toolbar-divider { width: 1px; height: 30px; background-color: var(--border-color); margin: 0 10px; }
        
        /* Boutons du ruban */
        select, .btn { background: var(--bg-app); color: var(--text-ui); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; outline: none; }
        .btn:hover { background: #3f3f4e; }
        .btn-icon { padding: 8px; border-radius: 6px; width: 34px; height: 34px; justify-content: center; }
        
        .btn-green { background: #10b981; color: white; border: none; }
        .btn-green:hover { background: #059669; }
        .btn-danger { color: #ef4444; }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }
        
        .font-tool { display: flex; align-items: center; gap: 5px; background: var(--bg-app); padding: 2px 2px 2px 10px; border-radius: 6px; border: 1px solid var(--border-color); }
        .font-tool i { font-family: 'Newsreader', serif; font-weight: 700; font-size: 16px; font-style: normal; }
        .font-tool select { border: none; background: transparent; padding: 6px; }

        /* --- CORPS DE L'APPLICATION --- */
        .main-body { display: flex; flex: 1; overflow: hidden; }
        
        /* --- SIDEBAR FIXE --- */
        .sidebar { width: 220px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }
        .menu-category { font-size: 11px; text-transform: uppercase; color: var(--text-muted); padding: 15px 20px 5px 20px; letter-spacing: 1px; font-weight: 700; }
        .menu-item { padding: 10px 20px; display: flex; align-items: center; gap: 12px; color: var(--text-muted); cursor: pointer; transition: 0.2s; font-size: 13px; font-weight: 500; border-left: 3px solid transparent; }
        .menu-item:hover { color: var(--text-ui); background: rgba(255,255,255,0.03); }
        .menu-item.active { color: cyan; background: rgba(0, 255, 255, 0.05); border-left: 3px solid cyan; }
        .menu-item i { width: 16px; text-align: center; }

        /* --- ZONE D'ÉDITION CENTRALE --- */
        .editor-workspace { flex: 1; background-color: #17171c; padding: 40px 20px; overflow-y: auto; display: flex; justify-content: center; align-items: flex-start; }
        
        .writing-sheet { width: 100%; max-width: 780px; background: var(--sheet-bg-clair); color: var(--sheet-text-clair); border-radius: 4px; padding: 50px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 24px; transition: background 0.3s, color 0.3s; }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; font-weight: 700; font-family: 'Inter', sans-serif; }
        
        input.text-input { background: transparent; border: none; border-bottom: 1px solid rgba(128,128,128,0.2); color: inherit; font-size: 26px; font-weight: 700; font-family: 'Newsreader', serif; padding: 5px 0; outline: none; }
        input.meta-input { background: rgba(128,128,128,0.08); border: 1px solid rgba(128,128,128,0.2); color: inherit; font-family: 'Inter', sans-serif; font-size: 13px; padding: 12px; border-radius: 6px; outline: none; width: 100%; }
        
        textarea.main-textarea { width: 100%; flex: 1; min-height: 500px; background: transparent; border: none; color: inherit; font-family: 'Newsreader', serif; font-size: 17px; line-height: 1.7; resize: none; outline: none; }
        
        .meta-row { display: flex; gap: 20px; }
        .meta-row .input-group { flex: 1; }
    </style>
</head>
<body>

    <!-- RUBAN DU HAUT (OFFICE STYLE) -->
    <div class="ribbon">
        <div class="ribbon-left">
            <div class="logo-text" id="mainLogo">Le Studio Pages.</div>
            
            <div class="toolbar">
                <!-- Gestion des pages -->
                <select id="pageSelector" onchange="loadPageData()"></select>
                <button class="btn" onclick="addPage()"><i class="fas fa-plus"></i> <span data-i18n="newBtn">Nouveau</span></button>
                <button class="btn btn-icon btn-danger" onclick="deletePage()" title="Supprimer la page"><i class="fas fa-trash"></i></button>
                
                <div class="toolbar-divider"></div>
                
                <!-- Typographie (Tt) -->
                <div class="font-tool" title="Police du texte">
                    <i>Tt</i>
                    <select id="fontSelector" onchange="changeFont()">
                        <option value="'Newsreader', serif">Newsreader</option>
                        <option value="'Inter', sans-serif">Inter</option>
                        <option value="'Courier Prime', monospace">Courier</option>
                        <option value="'Lora', serif">Lora</option>
                        <option value="'Merriweather', serif">Merriweather</option>
                        <option value="'Roboto', sans-serif">Roboto</option>
                    </select>
                </div>
                
                <!-- Thème de la feuille -->
                <button class="btn btn-icon" onclick="cycleTheme()" title="Couleur de la page"><i class="fa-solid fa-circle-half-stroke"></i></button>
                
                <div class="toolbar-divider"></div>
                
                <!-- Langue de l'interface -->
                <button class="btn" onclick="toggleLang()" id="langBtn">EN</button>
            </div>
        </div>
        
        <!-- Téléchargement -->
        <button class="btn btn-green" onclick="exportJSON()"><i class="fas fa-download"></i> <span data-i18n="downloadBtn">Générer JSON</span></button>
    </div>

    <!-- CORPS DE L'APPLICATION -->
    <div class="main-body">
        
        <!-- SIDEBAR FIXE -->
        <div class="sidebar">
            <div class="menu-category" data-i18n="catReading">Lecture</div>
            <div class="menu-item active" id="tab-book" onclick="setMode('book')"><i class="fas fa-book"></i> <span data-i18n="menuBook">Livre (Poche)</span></div>
            <div class="menu-item" id="tab-bd" onclick="setMode('bd')"><i class="fas fa-mask"></i> <span data-i18n="menuBd">Bande Dessinée</span></div>
            <div class="menu-item" id="tab-enfant" onclick="setMode('enfant')"><i class="fas fa-child"></i> <span data-i18n="menuKid">Livre Enfant</span></div>
            
            <div class="menu-category" data-i18n="catEdition">Éditions</div>
            <div class="menu-item" id="tab-magazine" onclick="setMode('magazine')"><i class="fas fa-th-large"></i> <span data-i18n="menuMag">Magazine</span></div>
            <div class="menu-item" id="tab-journal" onclick="setMode('journal')"><i class="far fa-newspaper"></i> <span data-i18n="menuNews">Journal</span></div>
            <div class="menu-item" id="tab-recette" onclick="setMode('recette')"><i class="fas fa-utensils"></i> <span data-i18n="menuRecipe">Recettes</span></div>
            
            <div class="menu-category" data-i18n="catSocial">Réseaux</div>
            <div class="menu-item" id="tab-post" onclick="setMode('post')"><i class="fas fa-layer-group"></i> <span data-i18n="menuPost">Fil d'Actualités</span></div>
        </div>

        <!-- ZONE D'ÉDITION -->
        <div class="editor-workspace">
            <div class="writing-sheet" id="writingSheet">
                
                <!-- Titre Global de l'App -->
                <div class="input-group" style="padding-bottom: 25px; border-bottom: 1px dashed rgba(128,128,128,0.3);">
                    <label id="globalTitleLabel" data-i18n="lblAppTitle">Nom de l'application (Global)</label>
                    <input type="text" id="globalTitle" class="text-input" data-i18n-placeholder="phAppTitle" placeholder="Titre global..." oninput="autoSave()">
                </div>

                <!-- Ligne Titre de page / Catégorie -->
                <div class="meta-row">
                    <div class="input-group">
                        <label id="labelTitle" data-i18n="lblPageTitle">Titre de la page</label>
                        <input type="text" id="itemTitle" class="meta-input" data-i18n-placeholder="phPageTitle" placeholder="Chapitre / Titre..." oninput="autoSave()">
                    </div>
                    <div class="input-group" id="grpCategory" style="display:none;">
                        <label data-i18n="lblCategory">Catégorie</label>
                        <input type="text" id="itemCategory" class="meta-input" data-i18n-placeholder="phCategory" placeholder="Ex: News..." oninput="autoSave()">
                    </div>
                </div>

                <!-- URL Image -->
                <div class="input-group">
                    <label id="labelImage" data-i18n="lblImage">URL de l'image (Optionnel)</label>
                    <input type="text" id="itemImage" class="meta-input" placeholder="https://..." oninput="autoSave()">
                </div>

                <!-- Texte -->
                <div class="input-group" style="flex:1;">
                    <label id="labelText" data-i18n="lblText">Contenu</label>
                    <textarea id="itemText" class="main-textarea" data-i18n-placeholder="phText" placeholder="Commencez à écrire..." oninput="autoSave()"></textarea>
                </div>
                
            </div>
        </div>
    </div>

    <script>
        // --- DICTIONNAIRE DE LANGUES ---
        const i18n = {
            fr: {
                logo: "Le Studio Pages.", langBtn: "EN",
                newBtn: "Nouveau", downloadBtn: "Générer JSON",
                catReading: "Lecture", catEdition: "Éditions", catSocial: "Réseaux",
                menuBook: "Livre (Poche)", menuBd: "Bande Dessinée", menuKid: "Livre Enfant",
                menuMag: "Magazine", menuNews: "Journal", menuRecipe: "Recettes", menuPost: "Fil d'Actualités",
                lblAppTitle: "Nom du projet (Global)", phAppTitle: "Ex: Mon Livre Magique",
                lblPageTitle: "Titre de la section", phPageTitle: "Chapitre / Titre...",
                lblCategory: "Catégorie", phCategory: "Ex: Actualité...",
                lblImage: "URL de l'image", lblImageReq: "URL DE LA PLANCHE (Obligatoire)",
                lblText: "Contenu du texte", lblTextOpt: "Texte (Optionnel pour BD)", phText: "Commencez à écrire...",
                defItem: "Élément"
            },
            en: {
                logo: "The Pages. Studio", langBtn: "FR",
                newBtn: "New", downloadBtn: "Generate JSON",
                catReading: "Reading", catEdition: "Publishing", catSocial: "Social",
                menuBook: "Pocket Book", menuBd: "Comic Book", menuKid: "Children's Book",
                menuMag: "Magazine", menuNews: "Newspaper", menuRecipe: "Recipes", menuPost: "News Feed",
                lblAppTitle: "Project Name (Global)", phAppTitle: "Ex: My Magic Book",
                lblPageTitle: "Section Title", phPageTitle: "Chapter / Title...",
                lblCategory: "Category", phCategory: "Ex: Breaking News...",
                lblImage: "Image URL", lblImageReq: "COMIC PAGE URL (Required)",
                lblText: "Text Content", lblTextOpt: "Text (Optional for Comics)", phText: "Start writing...",
                defItem: "Item"
            }
        };

        let currentLang = 'fr';

        // --- MOTEUR DE DONNÉES ---
        let appData = {
            book: { title: "", items: [{ id: '1', title: '', image: '', text: '' }] },
            bd: { title: "", items: [{ id: '1', title: '', image: '', text: '' }] },
            magazine: { title: "", items: [{ id: '1', title: '', category: '', image: '', text: '' }] },
            journal: { title: "", items: [{ id: '1', title: '', category: '', image: '', text: '' }] },
            enfant: { title: "", items: [{ id: '1', title: '', image: '', text: '' }] },
            recette: { title: "", items: [{ id: '1', title: '', category: '', image: '', text: '' }] },
            post: { title: "", items: [{ id: '1', title: '', category: '', image: '', text: '' }] }
        };

        let currentMode = 'book';
        let currentPageId = '1';
        
        // --- THÈME (Feuille uniquement) ---
        let themes = ['clair', 'papier', 'sombre'];
        let currentThemeIndex = 0;

        function cycleTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            const theme = themes[currentThemeIndex];
            const sheet = document.getElementById('writingSheet');
            
            if(theme === 'clair') { sheet.style.background = 'var(--sheet-bg-clair)'; sheet.style.color = 'var(--sheet-text-clair)'; }
            else if (theme === 'papier') { sheet.style.background = 'var(--sheet-bg-papier)'; sheet.style.color = 'var(--sheet-text-papier)'; }
            else { sheet.style.background = 'var(--sheet-bg-sombre)'; sheet.style.color = 'var(--sheet-text-sombre)'; }
        }

        // --- POLICES (Feuille uniquement) ---
        function changeFont() {
            const font = document.getElementById('fontSelector').value;
            document.getElementById('itemText').style.fontFamily = font;
            document.getElementById('itemTitle').style.fontFamily = font;
        }

        // --- TRADUCTION DE L'INTERFACE ---
        function toggleLang() {
            currentLang = currentLang === 'fr' ? 'en' : 'fr';
            document.getElementById('langBtn').innerText = i18n[currentLang].langBtn;
            document.getElementById('mainLogo').innerText = i18n[currentLang].logo;
            
            // Traduire les textes fixes
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang][key]) el.innerText = i18n[currentLang][key];
            });
            
            // Traduire les placeholders
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18n[currentLang][key]) el.placeholder = i18n[currentLang][key];
            });
            
            updateLabelsForMode();
            refreshSelector();
        }

        // --- GESTION DES MODES ET DES DONNÉES ---
        function setMode(mode) {
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + mode).classList.add('active');
            currentMode = mode;
            
            document.getElementById('globalTitle').value = appData[mode].title;
            
            const grpCat = document.getElementById('grpCategory');
            if(['magazine', 'journal', 'recette', 'post'].includes(mode)) {
                grpCat.style.display = 'flex';
            } else {
                grpCat.style.display = 'none';
            }

            updateLabelsForMode();
            refreshSelector();
        }

        function updateLabelsForMode() {
            if(currentMode === 'bd') {
                document.getElementById('itemText').style.minHeight = '150px';
                document.getElementById('labelText').innerText = i18n[currentLang].lblTextOpt;
                document.getElementById('labelImage').innerText = i18n[currentLang].lblImageReq;
                document.getElementById('itemImage').style.border = "1px solid cyan";
            } else {
                document.getElementById('itemText').style.minHeight = '500px';
                document.getElementById('labelText').innerText = i18n[currentLang].lblText;
                document.getElementById('labelImage').innerText = i18n[currentLang].lblImage;
                document.getElementById('itemImage').style.border = "1px solid rgba(128,128,128,0.2)";
            }
        }

        function refreshSelector() {
            const selector = document.getElementById('pageSelector');
            selector.innerHTML = '';
            const items = appData[currentMode].items;
            
            items.forEach((item, index) => {
                const opt = document.createElement('option');
                opt.value = item.id;
                opt.text = item.title || `${i18n[currentLang].defItem} ${index + 1}`;
                selector.appendChild(opt);
            });
            
            currentPageId = items.length > 0 ? items[0].id : null;
            if(currentPageId) { selector.value = currentPageId; loadPageData(); }
        }

        function loadPageData() {
            currentPageId = document.getElementById('pageSelector').value;
            const item = appData[currentMode].items.find(i => i.id === currentPageId);
            if(item) {
                document.getElementById('itemTitle').value = item.title || '';
                document.getElementById('itemImage').value = item.image || '';
                document.getElementById('itemText').value = item.text || '';
                if(document.getElementById('itemCategory')) document.getElementById('itemCategory').value = item.category || '';
            }
        }

        function autoSave() {
            if(!currentPageId) return;
            appData[currentMode].title = document.getElementById('globalTitle').value;
            
            let item = appData[currentMode].items.find(i => i.id === currentPageId);
            if(item) {
                item.title = document.getElementById('itemTitle').value;
                item.image = document.getElementById('itemImage').value;
                item.text = document.getElementById('itemText').value;
                if(document.getElementById('itemCategory')) item.category = document.getElementById('itemCategory').value;
                
                const opt = document.getElementById('pageSelector').querySelector(`option[value="${currentPageId}"]`);
                if(opt) opt.text = item.title || `${i18n[currentLang].defItem}`;
            }
        }

        function addPage() {
            let maxId = 0;
            appData[currentMode].items.forEach(i => maxId = Math.max(maxId, parseInt(i.id)));
            const newId = (maxId + 1).toString();
            appData[currentMode].items.push({ id: newId, title: '', image: '', text: '', category: '' });
            refreshSelector();
            document.getElementById('pageSelector').value = newId;
            loadPageData();
        }

        function deletePage() {
            if(appData[currentMode].items.length <= 1) return alert("Action impossible.");
            if(confirm("Confirmer la suppression ?")) {
                appData[currentMode].items = appData[currentMode].items.filter(i => i.id !== currentPageId);
                refreshSelector();
            }
        }

        // --- GÉNÉRATION JSON ---
        function exportJSON() {
            autoSave();
            const formatData = appData[currentMode];
            
            const exportObject = {
                format: currentMode,
                titre: formatData.title || (currentLang === 'fr' ? 'Sans Titre' : 'Untitled'),
                langue: currentLang,
                items: formatData.items
            };

            let filename = `${currentMode}.json`;
            if(currentMode === 'book') filename = 'livre.json';

            const jsonString = JSON.stringify(exportObject, null, 2);
            const blob = new Blob([jsonString], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement("a");
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Démarrage initial
        setMode('book');
    </script>
</body>
</html>
