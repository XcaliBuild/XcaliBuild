<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writer. · The Pages. Sources</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Newsreader:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,600&family=Merriweather:ital,wght@0,400;0,700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #000000;
            --glass-bg: rgba(20, 20, 25, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.12);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #22d3ee;
            --sheet-noir: #0f0f11; --sheet-text-noir: #e5e7eb;
            --sheet-bleu: #0f172a; --sheet-text-bleu: #cbd5e1;
            --sheet-vieux: #e8dcc6; --sheet-text-vieux: #3e2723;
            --sheet-clair: #fdfbf7; --sheet-text-clair: #1f2937;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at 50% -20%, #1a1a24 0%, var(--bg-base) 100%); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        ::-webkit-scrollbar { width: 5px; height: 5px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
       .glass { background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--glass-border); }
       .ribbon { width: 100%; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; flex-shrink: 0; z-index: 10; }
       .ribbon-group { display: flex; align-items: center; gap: 10px; }
       .logo-text { font-family: 'Newsreader', serif; font-size: 22px; font-weight: 600; color: #fff; letter-spacing: -0.5px; display:flex; align-items:center; gap:10px;}
       .logo-text.sources { font-family: 'EB Garamond', serif; font-style: italic; font-weight: 400; color: var(--accent); font-size: 22px; letter-spacing: 0.5px; text-shadow: 0 0 18px rgba(34,211,238,0.45); }
       .toolbar-divider { width: 1px; height: 20px; background-color: var(--glass-border); margin: 0 6px; }
        select,.btn { background: transparent; color: var(--text-main); border: 1px solid transparent; padding: 7px 12px; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s ease; outline: none; }
       .btn:hover { background: var(--glass-hover); border-color: var(--glass-border); }
       .btn-outline { border: 1px solid var(--glass-border); background: rgba(255,255,255,0.02); }
       .btn-primary { background: var(--accent); color: #000; font-weight: 600; }.btn-primary:hover { background: #06b6d4; }
       .btn-danger:hover { color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        select { border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); }
        select option { background-color: #111; color: #fff; }
       .sync-indicator { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
       .sync-indicator.synced i { color: #10b981; }
       .main-body { display: flex; flex: 1; overflow: hidden; }
       .sidebar { width: 240px; background: rgba(10, 10, 12, 0.5); border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; flex-shrink: 0; }
       .sidebar-scroll { flex: 1; overflow-y: auto; }
       .menu-category { font-size: 10px; text-transform: uppercase; color: var(--text-muted); padding: 18px 18px 8px 18px; letter-spacing: 1px; font-weight: 600; }
       .menu-item { padding: 9px 18px; display: flex; align-items: center; gap: 10px; color: var(--text-muted); cursor: pointer; transition: 0.2s; font-size: 13px; border-left: 2px solid transparent; }
       .menu-item:hover { color: var(--text-main); background: var(--glass-hover); }.menu-item.active { color: #fff; background: rgba(255,255,255,0.05); border-left: 2px solid var(--accent); }
       .workspace { flex: 1; padding: 32px; overflow-y: auto; display: flex; justify-content: center; align-items: flex-start; }
       .writing-sheet { width: 100%; max-width: 820px; border-radius: 10px; padding: 50px; display: flex; flex-direction: column; gap: 24px; transition: all 0.3s; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05); }
        body[data-theme="noir"].writing-sheet { background: var(--sheet-noir); color: var(--sheet-text-noir); }
        body[data-theme="bleu"].writing-sheet { background: radial-gradient(circle at top, #1e293b 0%, var(--sheet-bleu) 100%); color: var(--sheet-text-bleu); border-color: rgba(34,211,238,0.1); }
        body[data-theme="vieux"].writing-sheet { background: var(--sheet-vieux); color: var(--sheet-text-vieux); background-image: url('https://www.transparenttextures.com/patterns/old-paper.png'); }
        body[data-theme="clair"].writing-sheet { background: var(--sheet-clair); color: var(--sheet-text-clair); border-color: rgba(0,0,0,0.08); }
       .input-group { display: flex; flex-direction: column; gap: 6px; }.input-group label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.6; font-weight: 600; display:flex; justify-content:space-between; }
        input.text-input { background: transparent; border: none; border-bottom: 1px solid rgba(128,128,128,0.15); color: inherit; font-size: 22px; font-weight: 600; font-family: inherit; padding: 8px 0; outline: none; }
        input.text-input:focus { border-bottom-color: var(--accent); }
        input.meta-input { background: rgba(128,128,128,0.06); border: 1px solid rgba(128,128,128,0.15); color: inherit; font-family: 'Inter', sans-serif; font-size: 13px; padding: 10px 14px; border-radius: 6px; outline: none; width: 100%; }
        textarea.main-textarea { width: 100%; min-height: 380px; background: transparent; border: none; color: inherit; font-family: inherit; font-size: 17px; line-height: 1.85; resize: vertical; outline: none; }
       .meta-row { display: flex; gap: 18px; flex-wrap: wrap; }.meta-row.input-group { flex: 1; min-width: 180px; }
       .segment-group { display: flex; background: rgba(128,128,128,0.08); border-radius: 6px; padding: 3px; border: 1px solid rgba(128,128,128,0.15); }
       .segment-btn { flex: 1; background: transparent; color: inherit; opacity: 0.6; border: none; padding: 7px; font-size: 11px; cursor: pointer; border-radius: 4px; display:flex; align-items:center; justify-content:center; gap:5px; }.segment-btn.active { background: var(--text-main); color: #000; opacity: 1; font-weight: 600; }
        body[data-theme="vieux"].segment-btn.active, body[data-theme="clair"].segment-btn.active { background: #111; color: #fff; }
        input[type="range"] { width: 100%; accent-color: var(--accent); }
       .char-counter { font-size: 11px; text-align: right; margin-top: 4px; }.char-counter.warn { color: #f59e0b; }.char-counter.over { color: #ef4444; font-weight: 600; }
       .btn-preview { position: fixed; bottom: 24px; right: 24px; background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); color: var(--text-main); padding: 12px 18px; border-radius: 30px; font-size: 13px; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; gap: 8px; z-index: 50; }
       .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.82); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }.overlay.active { display: flex; }
       .modal-box { background: #111114; border: 1px solid var(--glass-border); border-radius: 16px; width: 100%; max-width: 720px; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
       .modal-header { padding: 18px 20px; border-bottom: 1px solid var(--glass-border); display:flex; justify-content:space-between; align-items:center; }.modal-header h3 { font-size: 15px; font-weight: 600; }
       .modal-content { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 20px; }
       .preview-shell { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
       .preview-topbar { display: flex; gap: 10px; align-items: center; background: #1a1a1e; border: 1px solid var(--glass-border); padding: 8px 12px; border-radius: 30px; }
       .preview-screen { background: #faf8f5; border-radius: 24px; overflow-y: auto; overflow-x: hidden; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 8px solid #222; transition: all 0.3s; }
       .preview-screen.mobile { width: 390px; height: 720px; }.preview-screen.tablet { width: 768px; height: 600px; border-radius: 16px; }
       .prv-content { padding: 26px; color: #111; font-size: 15px; line-height: 1.6; }.prv-title { font-size: 1.6em; font-weight: bold; margin-bottom: 14px; line-height: 1.2; }.prv-img { border-radius: 8px; object-fit: cover; display:block; margin: 12px auto; }.prv-img.bg-mode { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.14; border-radius: 0; z-index: 0; margin: 0; }.prv-text { position: relative; z-index: 1; white-space: pre-wrap; text-align: left; }.prv-split { display: flex; flex-direction: column; gap: 16px; }
       .project-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border: 1px solid var(--glass-border); border-radius: 8px; background: rgba(255,255,255,0.03); }.project-item.active { border-color: var(--accent); background: rgba(34,211,238,0.08); }
       .theme-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }.theme-card { padding: 14px; border-radius: 10px; border: 1px solid var(--glass-border); cursor: pointer; text-align: left; }.theme-card.active { border-color: var(--accent); }.font-upload { border: 1px dashed var(--glass-border); padding: 14px; border-radius: 8px; text-align: center; cursor: pointer; }
    </style>
    <style id="customFontsStyle"></style>
</head>
<body data-theme="noir">
    <div class="ribbon glass">
        <div class="ribbon-group">
            <div class="logo-text">The Pages.<span class="sources">Sources</span></div>
            <div class="toolbar-divider"></div>
            <button class="btn btn-outline" onclick="openProjects()"><i class="fas fa-folder"></i> Mes Projets</button>
            <select id="pageSelector" onchange="onPageChange()"></select>
            <button class="btn btn-outline" onclick="addPage()"><i class="fas fa-plus"></i></button>
            <button class="btn btn-outline btn-danger" onclick="deletePage()"><i class="fas fa-trash"></i></button>
        </div>
        <div class="ribbon-group">
            <div class="sync-indicator synced" id="syncIndicator"><i class="fas fa-check-circle"></i> <span id="syncText">sync</span></div>
            <div class="toolbar-divider"></div>
            <select id="fontSelector" onchange="changeFont()"></select>
            <button class="btn btn-outline" onclick="openSettings()" title="Paramètres"><i class="fas fa-cog"></i></button>
            <div class="toolbar-divider"></div>
            <button class="btn btn-outline" onclick="exportWorkflow()"><i class="fas fa-download"></i> Backup</button>
            <button class="btn btn-outline" onclick="manualSave()" style="color:var(--accent);"><i class="fas fa-save"></i> Save</button>
            <button class="btn btn-primary" onclick="exportPagesData()">pages.data</button>
        </div>
    </div>

    <div class="main-body">
        <div class="sidebar">
            <div class="sidebar-scroll">
                <div class="menu-category">Lecture</div>
                <div class="menu-item active" id="tab-book" onclick="setMode('book')"><i class="fas fa-book"></i> Livre (Poche)</div>
                <div class="menu-item" id="tab-bd" onclick="setMode('bd')"><i class="fas fa-mask"></i> Bande Dessinée</div>
                <div class="menu-item" id="tab-enfant" onclick="setMode('enfant')"><i class="fas fa-child"></i> Livre Enfant</div>
                <div class="menu-category">Éditions</div>
                <div class="menu-item" id="tab-magazine" onclick="setMode('magazine')"><i class="fas fa-th-large"></i> Magazine</div>
                <div class="menu-item" id="tab-journal" onclick="setMode('journal')"><i class="far fa-newspaper"></i> Journal</div>
                <div class="menu-category">Projet Actuel</div>
                <div style="padding: 0 18px 10px; font-size: 12px; color: var(--text-muted);" id="currentProjectName">-</div>
            </div>
            <div style="padding: 12px; border-top: 1px solid var(--glass-border);">
                <button class="btn btn-outline" style="width:100%; justify-content:center;" onclick="openSettings()"><i class="fas fa-sliders-h"></i> Paramètres</button>
            </div>
        </div>
        <div class="workspace">
            <div class="writing-sheet">
                <div class="input-group">
                    <label>Titre de l'œuvre</label>
                    <input type="text" id="globalTitle" class="text-input" placeholder="Ex: Mon Chef-d'œuvre" oninput="autoSave()">
                </div>
                <div class="meta-row" style="margin-top:8px;">
                    <div class="input-group" style="flex:2;">
                        <label>Titre du chapitre / section</label>
                        <input type="text" id="itemTitle" class="meta-input" placeholder="Chapitre 1..." style="font-weight:bold;" oninput="autoSave()">
                    </div>
                </div>
                <div class="meta-row">
                    <div class="input-group" style="flex:2;">
                        <label>Illustration (URL)</label>
                        <input type="text" id="itemImage" class="meta-input" placeholder="https://..." oninput="autoSave()">
                    </div>
                    <div class="input-group" style="flex:1.3;">
                        <label>Disposition</label>
                        <div class="segment-group">
                            <button class="segment-btn active" id="lay-top" onclick="setLayout('top')"><i class="fas fa-arrow-up"></i> Haut</button>
                            <button class="segment-btn" id="lay-center" onclick="setLayout('center')"><i class="fas fa-align-center"></i> Centre</button>
                            <button class="segment-btn" id="lay-bottom" onclick="setLayout('bottom')"><i class="fas fa-arrow-down"></i> Bas</button>
                            <button class="segment-btn" id="lay-bg" onclick="setLayout('bg')"><i class="fas fa-image"></i></button>
                        </div>
                    </div>
                </div>
                <div class="meta-row">
                    <div class="input-group" style="flex:1;">
                        <label>Taille image <span id="imageSizeVal">70%</span></label>
                        <input type="range" id="imageSize" min="20" max="100" value="70" oninput="updateImageSize(this.value)">
                    </div>
                <div class="input-group" style="flex:1;">
                    <label>Corps du texte <span id="charCounterLabel"></span></label>
                    <textarea id="itemText" class="main-textarea" placeholder="Commencez à écrire..." oninput="autoSave()"></textarea>
                    <div id="charCounter" class="char-counter">0 / 1500</div>
                </div>
            </div>
            <button class="btn-preview" onclick="openPreview()"><i class="fas fa-mobile-alt"></i> Aperçu</button>
        </div>
    </div>

    <!-- PREVIEW OVERLAY -->
    <div class="overlay" id="previewModal" onclick="handleOverlayClick(event)">
        <div class="preview-shell" onclick="event.stopPropagation()">
            <div class="preview-topbar">
                <button class="btn btn-outline" id="btnMobile" onclick="setPreviewDevice('mobile')"><i class="fas fa-mobile-alt"></i> Mobile</button>
                <button class="btn btn-outline" id="btnTablet" onclick="setPreviewDevice('tablet')"><i class="fas fa-tablet-alt"></i> Tablette</button>
                <div class="toolbar-divider"></div>
                <button class="btn btn-primary" onclick="closePreview()"><i class="fas fa-times"></i> Fermer</button>
            </div>
            <div class="preview-screen mobile" id="previewScreen"><div class="prv-content" id="prvContent"></div></div>
        </div>
    </div>

    <!-- PROJECTS OVERLAY -->
    <div class="overlay" id="projectsModal">
        <div class="modal-box">
            <div class="modal-header"><h3><i class="fas fa-folder-open"></i> Mes Projets</h3><button class="btn" onclick="closeProjects()"><i class="fas fa-times"></i></button></div>
            <div class="modal-content">
                <div style="display:flex; gap:8px;">
                    <input type="text" id="newProjectTitle" class="meta-input" placeholder="Titre du nouveau livre..." style="flex:1;">
                    <button class="btn btn-primary" onclick="createNewProject()"><i class="fas fa-plus"></i> Nouveau Livre</button>
                </div>
                <div id="projectsList" style="display:flex; flex-direction:column; gap:8px;"></div>
            </div>
        </div>
    </div>

    <!-- SETTINGS OVERLAY -->
    <div class="overlay" id="settingsModal">
        <div class="modal-box">
            <div class="modal-header"><h3><i class="fas fa-cog"></i> Paramètres</h3><button class="btn" onclick="closeSettings()"><i class="fas fa-times"></i></button></div>
            <div class="modal-content">
                <div>
                    <label style="font-size:11px; text-transform:uppercase; opacity:0.6;">Langue</label>
                    <div style="display:flex; gap:8px; margin-top:8px;">
                        <button class="btn btn-outline" id="lang-fr" onclick="setLang('fr')">FR Français</button>
                        <button class="btn btn-outline" id="lang-en" onclick="setLang('en')">EN English</button>
                    </div>
                </div>
                <div>
                    <label style="font-size:11px; text-transform:uppercase; opacity:0.6;">Thèmes d'écriture</label>
                    <div class="theme-grid" style="margin-top:8px;">
                        <button class="theme-card" onclick="setTheme('noir')" data-theme-card="noir" style="background:#0f0f11; color:#e5e7eb;"><b>Noir</b><br><small>Profondeur pure</small></button>
                        <button class="theme-card" onclick="setTheme('bleu')" data-theme-card="bleu" style="background:#0f172a; color:#cbd5e1;"><b>Écran Bleu</b><br><small>Lecture nuit</small></button>
                        <button class="theme-card" onclick="setTheme('vieux')" data-theme-card="vieux" style="background:#e8dcc6; color:#3e2723;"><b>Papier Vieux</b><br><small>Texture ancien</small></button>
                        <button class="theme-card" onclick="setTheme('clair')" data-theme-card="clair" style="background:#fdfbf7; color:#1f2937; border:1px solid #ddd;"><b>Papier Clair</b><br><small>Écran doux</small></button>
                    </div>
                </div>
                <div>
                    <label style="font-size:11px; text-transform:uppercase; opacity:0.6;">Polices</label>
                    <div id="fontsList" style="display:flex; flex-direction:column; gap:6px; margin-top:8px;"></div>
                    <div class="font-upload" style="margin-top:10px;" onclick="document.getElementById('fontFileInput').click()">
                        <i class="fas fa-upload"></i> Importer une police (.ttf,.otf,.woff,.woff2)
                        <input type="file" id="fontFileInput" accept=".ttf,.otf,.woff,.woff2" style="display:none" onchange="handleFontUpload(event)">
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
const i18n = {
    fr: { cover:"Couverture", summary:"Sommaire", page:"Page", limitBook:"Page poche (1500)", limitBD:"Planche (500)", limitKid:"Page enfant (700)", limitMag:"Magazine (2000)" },
    en: { cover:"Cover", summary:"Summary", page:"Page", limitBook:"Pocket page (1500)", limitBD:"Board (500)", limitKid:"Kids page (700)", limitMag:"Magazine (2000)" }
};
const fontMappingBase = {
    'Newsreader': "'Newsreader', serif",
    'Inter': "'Inter', sans-serif",
    'EB Garamond': "'EB Garamond', serif",
    'Lora': "'Lora', serif",
    'Merriweather': "'Merriweather', serif"
};
let fontMapping = {...fontMappingBase};
let customFonts = [];
let currentLang = 'fr';
let currentTheme = 'noir';
let currentMode = 'book';
let currentPageId = null;
let currentProjectId = null;
let projects = [];
let appConfig = { fontFamily: 'Newsreader', theme: 'noir' };
let saveTimeout = null;
let previewDevice = 'mobile';

const LIMITS = { book:1500, bd:500, enfant:700, magazine:2000, journal:2000 };

let defaultDataTemplate = () => ({
    book: { title:"", items:[{ id:'cover', title:'Couverture', image:'', layout:'top', imageSize:70, text:'' }, { id:'p1', title:'Chapitre 1', image:'', layout:'top', imageSize:70, text:'' }] },
    bd: { title:"", items:[{ id:'1', title:'Planche 1', image:'', layout:'bg', imageSize:100, text:'' }] },
    magazine: { title:"", items:[{ id:'1', title:'Article 1', image:'', layout:'top', imageSize:70, text:'' }] },
    journal: { title:"", items:[{ id:'1', title:'News 1', image:'', layout:'top', imageSize:70, text:'' }] },
    enfant: { title:"", items:[{ id:'1', title:'Page 1', image:'', layout:'top', imageSize:80, text:'' }] }
});

function uid(){ return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); }

function loadCustomFonts(){
    try{
        const saved = JSON.parse(localStorage.getItem('writer_custom_fonts')||'[]');
        customFonts = saved;
        const styleEl = document.getElementById('customFontsStyle');
        let css = '';
        customFonts.forEach(f=>{
            css += `@font-face{ font-family:'${f.name}'; src:url('${f.dataUrl}'); }\n`;
            fontMapping[f.name]=`'${f.name}'`;
        });
        styleEl.textContent = css;
        renderFonts();
        refreshFontSelector();
    }catch(e){}
}
function refreshFontSelector(){
    const sel = document.getElementById('fontSelector');
    const cur = sel.value || appConfig.fontFamily;
    sel.innerHTML='';
    Object.keys(fontMapping).forEach(name=>{
        const o=document.createElement('option'); o.value=name; o.textContent=name; sel.appendChild(o);
    });
    sel.value = fontMapping[cur]?cur:Object.keys(fontMapping)[0];
}
function handleFontUpload(e){
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
        const dataUrl = ev.target.result;
        const name = file.name.replace(/\.[^/.]+$/,"").replace(/[^a-zA-Z0-9 _-]/g,'').trim() || 'CustomFont';
        if(fontMapping[name]){ alert('Police déjà existante'); return; }
        const styleEl = document.getElementById('customFontsStyle');
        styleEl.textContent += `\n@font-face{ font-family:'${name}'; src:url('${dataUrl}'); }\n`;
        fontMapping[name]=`'${name}'`;
        customFonts.push({name, dataUrl});
        localStorage.setItem('writer_custom_fonts', JSON.stringify(customFonts));
        refreshFontSelector();
        renderFonts();
        document.getElementById('fontSelector').value=name;
        changeFont();
    };
    reader.readAsDataURL(file);
    e.target.value='';
}
function renderFonts(){
    const cont = document.getElementById('fontsList');
    cont.innerHTML='';
    Object.keys(fontMapping).forEach(name=>{
        const div=document.createElement('div');
        div.className='project-item';
        div.innerHTML=`<span style="font-family:${fontMapping[name]}">${name}</span><small style="opacity:0.5">${customFonts.find(f=>f.name===name)?'custom':'système'}</small>`;
        cont.appendChild(div);
    });
}

function loadProjects(){
    try{
        projects = JSON.parse(localStorage.getItem('writer_projects_v2')||'[]');
        currentProjectId = localStorage.getItem('writer_current_project_id');
        if(projects.length===0){
            const p = { id:uid(), title:'Mon premier livre', data:defaultDataTemplate(), config:{fontFamily:'Newsreader', theme:'noir'}, mode:'book', pageId:'cover', updatedAt:Date.now() };
            projects=[p]; currentProjectId=p.id; saveProjects();
        }
        if(!projects.find(p=>p.id===currentProjectId)) currentProjectId=projects[0].id;
    }catch(e){ projects=[]; }
}
function saveProjects(){
    localStorage.setItem('writer_projects_v2', JSON.stringify(projects));
    localStorage.setItem('writer_current_project_id', currentProjectId);
}
function getCurrentProject(){ return projects.find(p=>p.id===currentProjectId); }

function openProjects(){ renderProjectsList(); document.getElementById('projectsModal').classList.add('active'); }
function closeProjects(){ document.getElementById('projectsModal').classList.remove('active'); }
function renderProjectsList(){
    const list=document.getElementById('projectsList'); list.innerHTML='';
    projects.slice().sort((a,b)=>b.updatedAt-a.updatedAt).forEach(p=>{
        const div=document.createElement('div'); div.className='project-item'+(p.id===currentProjectId?' active':'');
        div.innerHTML=`<div><b>${p.title||'Sans titre'}</b><br><small style="opacity:0.6">${new Date(p.updatedAt).toLocaleString()} · ${p.data[p.mode]?.items?.length||0} pages</small></div>
        <div style="display:flex; gap:6px;">
        <button class="btn btn-outline" onclick="switchProject('${p.id}')"><i class="fas fa-external-link-alt"></i></button>
        <button class="btn btn-outline" onclick="duplicateProject('${p.id}')"><i class="fas fa-copy"></i></button>
        <button class="btn btn-outline btn-danger" onclick="deleteProject('${p.id}')"><i class="fas fa-trash"></i></button></div>`;
        list.appendChild(div);
    });
}
function createNewProject(){
    const input=document.getElementById('newProjectTitle'); const title=input.value.trim()||'Nouveau Livre';
    const p={ id:uid(), title, data:defaultDataTemplate(), config:{fontFamily:appConfig.fontFamily, theme:currentTheme}, mode:'book', pageId:'cover', updatedAt:Date.now() };
    projects.unshift(p); currentProjectId=p.id; saveProjects(); loadProjectIntoUI(); input.value=''; renderProjectsList();
}
function switchProject(id){ currentProjectId=id; saveProjects(); loadProjectIntoUI(); closeProjects(); }
function duplicateProject(id){ const src=projects.find(p=>p.id===id); if(!src) return; const copy=JSON.parse(JSON.stringify(src)); copy.id=uid(); copy.title=src.title+' (copie)'; copy.updatedAt=Date.now(); projects.unshift(copy); saveProjects(); renderProjectsList(); }
function deleteProject(id){
    if(projects.length<=1){ alert(currentLang==='fr'?'Il faut au moins un projet':'At least one project'); return; }
    if(!confirm(currentLang==='fr'?'Supprimer ce projet?':'Delete this project?')) return;
    projects=projects.filter(p=>p.id!==id); if(currentProjectId===id) currentProjectId=projects[0].id; saveProjects(); loadProjectIntoUI(); renderProjectsList();
}

function loadProjectIntoUI(){
    const proj=getCurrentProject(); if(!proj) return;
    appConfig=proj.config||{fontFamily:'Newsreader', theme:'noir'};
    currentTheme=appConfig.theme||'noir'; document.body.setAttribute('data-theme', currentTheme);
    currentMode=proj.mode||'book'; currentPageId=proj.pageId||proj.data[currentMode]?.items?.[0]?.id||'cover';
    document.getElementById('currentProjectName').textContent=proj.title;
    document.getElementById('globalTitle').value=proj.data[currentMode]?.title||proj.title||'';
    document.getElementById('fontSelector').value=appConfig.fontFamily||'Newsreader';
    applyFont(appConfig.fontFamily);
    setMode(currentMode, false);
    refreshSelector(true);
    highlightTheme();
    highlightLang();
}

function setLang(l){
    currentLang=l; localStorage.setItem('writer_lang', l);
    highlightLang(); refreshSelector();
}
function highlightLang(){
    document.getElementById('lang-fr')?.classList.toggle('btn-primary', currentLang==='fr');
    document.getElementById('lang-en')?.classList.toggle('btn-primary', currentLang==='en');
}
function setTheme(t){
    currentTheme=t; appConfig.theme=t; document.body.setAttribute('data-theme', t);
    highlightTheme(); autoSave();
}
function highlightTheme(){
    document.querySelectorAll('[data-theme-card]').forEach(el=> el.classList.toggle('active', el.dataset.themeCard===currentTheme));
}

function openSettings(){ document.getElementById('settingsModal').classList.add('active'); renderFonts(); highlightTheme(); highlightLang(); }
function closeSettings(){ document.getElementById('settingsModal').classList.remove('active'); }

function setMode(mode, save=true){
    currentMode=mode;
    document.querySelectorAll('.menu-item').forEach(el=> el.classList.remove('active'));
    const tab=document.getElementById('tab-'+mode); if(tab) tab.classList.add('active');
    const proj=getCurrentProject(); if(proj){ proj.mode=mode; document.getElementById('globalTitle').value=proj.data[mode]?.title||''; }
    refreshSelector();
    if(save) autoSave();
}
function refreshSelector(keepPage=false){
    const proj=getCurrentProject(); if(!proj) return;
    const selector=document.getElementById('pageSelector'); selector.innerHTML='';
    const items=proj.data[currentMode]?.items||[];
    items.forEach((item, idx)=>{
        const opt=document.createElement('option'); opt.value=item.id;
        let label=item.title;
        if(!label){ if(currentMode==='book' && item.id==='cover') label=i18n[currentLang].cover; else label=`${i18n[currentLang].page} ${idx+1}`; }
        opt.text=label; selector.appendChild(opt);
    });
    if(!keepPage ||!items.find(i=>i.id===currentPageId)){ if(items.length) currentPageId=items[0].id; }
    if(currentPageId) selector.value=currentPageId;
    loadPageData();
}
function onPageChange(){ currentPageId=document.getElementById('pageSelector').value; loadPageData(); }
function loadPageData(){
    const proj=getCurrentProject(); if(!proj) return;
    const item=proj.data[currentMode]?.items.find(i=>i.id===currentPageId); if(!item) return;
    document.getElementById('itemTitle').value=item.title||'';
    document.getElementById('itemImage').value=item.image||'';
    document.getElementById('itemText').value=item.text||'';
    document.getElementById('imageSize').value=item.imageSize||70;
    document.getElementById('imageSizeVal').textContent=(item.imageSize||70)+'%';
    setLayout(item.layout||'top', false);
    updateCharCounter();
}
function setLayout(layoutStr, doSave=true){
    document.querySelectorAll('.segment-btn').forEach(b=> b.classList.remove('active'));
    const el=document.getElementById('lay-'+layoutStr); if(el) el.classList.add('active');
    if(doSave) autoSave();
}
function updateImageSize(v){ document.getElementById('imageSizeVal').textContent=v+'%'; autoSave(); }
function updateCharCounter(){
    const limit=LIMITS[currentMode]||1500;
    const text=document.getElementById('itemText').value;
    const len=text.length;
    const counter=document.getElementById('charCounter');
    counter.textContent=`${len} / ${limit}`;
    counter.className='char-counter'+(len>limit?' over': len>limit*0.8?' warn':'');
    document.getElementById('charCounterLabel').textContent = `· ${i18n[currentLang]['limit'+(currentMode==='book'?'Book': currentMode==='bd'?'BD': currentMode==='enfant'?'Kid':'Mag') ] || (limit+' max')}`;
}
function autoSave(){
    const proj=getCurrentProject(); if(!proj) return;
    setSyncStatus('saving');
    clearTimeout(saveTimeout);
    saveTimeout=setTimeout(()=>{
        const globalTitle=document.getElementById('globalTitle').value;
        proj.title=globalTitle||proj.title;
        proj.data[currentMode].title=globalTitle;
        const item=proj.data[currentMode].items.find(i=>i.id===currentPageId);
        if(item){
            const newText=document.getElementById('itemText').value;
            const limit=LIMITS[currentMode]||1500;
            if(newText.length>limit){
                document.getElementById('itemText').value=newText.slice(0,limit);
            }
            item.title=document.getElementById('itemTitle').value;
            item.image=document.getElementById('itemImage').value;
            item.text=document.getElementById('itemText').value;
            item.layout=document.querySelector('.segment-btn.active')?.id.replace('lay-','')||'top';
            item.imageSize=parseInt(document.getElementById('imageSize').value)||70;
            const opt=document.getElementById('pageSelector').querySelector(`option[value="${currentPageId}"]`);
            if(opt) opt.text=item.title||`${i18n[currentLang].page}`;
        }
        proj.config=appConfig; proj.pageId=currentPageId; proj.mode=currentMode; proj.updatedAt=Date.now();
        saveProjects();
        setSyncStatus('synced');
        updateCharCounter();
        document.getElementById('currentProjectName').textContent=proj.title;
    }, 400);
}
function setSyncStatus(s){
    const ind=document.getElementById('syncIndicator');
    if(s==='saving') ind.innerHTML='<i class="fas fa-sync-alt fa-spin"></i> saving';
    else ind.innerHTML='<i class="fas fa-check-circle"></i> sync';
}
function addPage(){
    const proj=getCurrentProject(); if(!proj) return;
    const newId='p_'+Date.now();
    proj.data[currentMode].items.push({ id:newId, title:'', image:'', layout:'top', imageSize:70, text:'' });
    currentPageId=newId; saveProjects(); refreshSelector(true); autoSave();
}
function deletePage(){
    const proj=getCurrentProject(); if(!proj) return;
    if(proj.data[currentMode].items.length<=1) return;
    if(!confirm('Supprimer cette page?')) return;
    proj.data[currentMode].items=proj.data[currentMode].items.filter(i=>i.id!==currentPageId);
    currentPageId=proj.data[currentMode].items[0].id; saveProjects(); refreshSelector(true);
}
function changeFont(){
    const name=document.getElementById('fontSelector').value;
    appConfig.fontFamily=name; applyFont(name); saveProjects();
}
function applyFont(name){
    const css=fontMapping[name]||fontMapping['Newsreader'];
    document.getElementById('itemText').style.fontFamily=css;
    document.getElementById('itemTitle').style.fontFamily=css;
    document.getElementById('globalTitle').style.fontFamily=css;
}
function splitTextForCenter(text){
    if(!text || text.length<60) return [text, ''];
    const mid=Math.floor(text.length/2);
    let splitIdx=text.indexOf('\n\n', mid-100);
    if(splitIdx===-1) splitIdx=text.lastIndexOf('. ', mid);
    if(splitIdx===-1) splitIdx=mid;
    return [text.slice(0,splitIdx).trim(), text.slice(splitIdx).trim()];
}
function openPreview(){
    autoSave();
    const proj=getCurrentProject(); if(!proj) return;
    const item=proj.data[currentMode].items.find(i=>i.id===currentPageId); if(!item) return;
    const modal=document.getElementById('previewModal');
    const contentBox=document.getElementById('prvContent');
    const fontCSS=fontMapping[appConfig.fontFamily]||fontMapping['Newsreader'];
    contentBox.style.fontFamily=fontCSS;
    let html='';
    const titleHTML=item.title?`<div class="prv-title">${escapeHtml(item.title)}</div>`:'';
    const size=item.imageSize||70;
    const imgStyle=`width:${size}%;`;
    const imgHTML=item.image?`<img src="${item.image}" class="prv-img ${item.layout==='bg'?'bg-mode':''}" style="${item.layout!=='bg'?imgStyle:''}" onerror="this.style.display='none'">`:'';
    const textEscaped=escapeHtml(item.text||'');
    if(item.layout==='bg'){
        html=imgHTML+`<div style="position:relative; z-index:1;">${titleHTML}<div class="prv-text">${textEscaped}</div></div>`;
    } else if(item.layout==='center'){
        const [a,b]=splitTextForCenter(item.text||'');
        html=`<div class="prv-split"><div class="prv-text">${escapeHtml(a)}</div>${imgHTML}<div class="prv-text">${escapeHtml(b)}</div></div>`;
        if(titleHTML) html=titleHTML+html;
    } else if(item.layout==='top'){
        html=imgHTML+titleHTML+`<div class="prv-text">${textEscaped}</div>`;
    } else {
        html=titleHTML+`<div class="prv-text">${textEscaped}</div>`+imgHTML;
    }
    contentBox.innerHTML=html;
    modal.classList.add('active');
    setPreviewDevice(previewDevice);
}
function closePreview(){ document.getElementById('previewModal').classList.remove('active'); }
function handleOverlayClick(e){ if(e.target.id==='previewModal') closePreview(); }
function setPreviewDevice(dev){
    previewDevice=dev;
    const scr=document.getElementById('previewScreen');
    scr.className='preview-screen '+dev;
    document.getElementById('btnMobile').classList.toggle('btn-primary', dev==='mobile');
    document.getElementById('btnTablet').classList.toggle('btn-primary', dev==='tablet');
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function exportWorkflow(){
    autoSave();
    const proj=getCurrentProject();
    const blob=new Blob([JSON.stringify({ project:proj, projectsMeta:projects.map(p=>({id:p.id, title:p.title})), customFonts:customFonts.map(f=>f.name) }, null, 2)], {type:"application/json"});
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=(proj.title||'projet')+".writerwork"; a.click(); URL.revokeObjectURL(url);
}
function exportPagesData(){
    autoSave();
    const proj=getCurrentProject(); if(!proj) return;
    const items=proj.data[currentMode].items.map(it=>{
        const limit=LIMITS[currentMode]||1500;
        return {
            id: it.id,
            title: it.title,
            image: it.image,
            layout: it.layout,
            imageSize: it.imageSize||70,
            text: it.text,
            charCount: (it.text||'').length,
            charLimit: limit,
            splitCenter: it.layout==='center',
            readingTime: Math.ceil((it.text||'').split(/\s+/).length/200)+' min'
        };
    });
    const exportObj={
        projectTitle: proj.title,
        format: currentMode,
        langue: currentLang,
        exportDate: new Date().toISOString(),
        config:{
            fontFamily: appConfig.fontFamily,
            fontCSS: fontMapping[appConfig.fontFamily],
            theme: appConfig.theme,
            themeLabel: currentTheme,
            limits: LIMITS,
            customFontsAvailable: customFonts.map(f=>f.name)
        },
        items
    };
    const blob=new Blob([JSON.stringify(exportObj, null, 2)], {type:"application/json"});
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download="pages.data"; a.click(); URL.revokeObjectURL(url);
}
function manualSave(){ autoSave(); setTimeout(()=>{ setSyncStatus('synced'); }, 200); }

window.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closePreview(); closeSettings(); closeProjects(); } });
window.onload=()=>{
    currentLang=localStorage.getItem('writer_lang')||'fr';
    loadCustomFonts();
    loadProjects();
    loadProjectIntoUI();
};
</script>
</body>
</html>
