<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writer. · The Pages. Sources</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Lora:wght@400;600&family=Merriweather:wght@400;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
:root{--bg:#000;--glass:rgba(20,20,25,0.88);--border:rgba(255,255,255,0.08);--hover:rgba(255,255,255,0.1);--text:#f3f4f6;--muted:#9ca3af;--accent:#22d3ee;}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:radial-gradient(circle at 50% -20%,#1c1c26 0%,#000 100%);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:10px}
.glass{background:var(--glass);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.ribbon{height:64px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;z-index:30;flex-wrap:wrap;gap:8px}
.ribbon-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo-txt{line-height:.95}.logo-main{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;letter-spacing:-1px;font-style:italic;color:#fff}.logo-sub{font-family:'Inter',sans-serif;font-size:9.5px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-left:2px}
.divider{width:1px;height:20px;background:var(--border);margin:0 6px}
.btn,select{background:transparent;color:var(--text);border:1px solid transparent;padding:7px 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.2s;outline:none}
.btn:hover{background:var(--hover);border-color:var(--border)}.btn-outline{border-color:var(--border);background:rgba(255,255,255,.03)}.btn-primary{background:var(--accent);color:#000;font-weight:700}.btn-danger{color:#ef4444}
select{border-color:var(--border);background:rgba(0,0,0,.4)}select option{background:#111}
.sync{font-size:10px;color:var(--muted);text-transform:uppercase;display:flex;gap:6px;align-items:center}
.main-body{display:flex;flex:1;overflow:hidden}.sidebar{width:230px;background:rgba(10,10,12,.65);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}.sidebar-scroll{flex:1;overflow-y:auto}
.cat{font-size:10px;text-transform:uppercase;color:var(--muted);padding:18px 16px 8px;letter-spacing:1px;font-weight:600}.menu-item{padding:9px 16px;display:flex;gap:10px;color:var(--muted);cursor:pointer;font-size:13px;border-left:2px solid transparent}.menu-item:hover{background:var(--hover);color:var(--text)}.menu-item.active{color:#fff;background:rgba(255,255,255,.05);border-left-color:var(--accent)}
.workspace{flex:1;padding:28px;overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;position:relative}
.page-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(18,18,22,.85);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:15;transition:.2s;color:var(--muted)}.page-nav:hover{background:rgba(255,255,255,.1);color:#fff;border-color:var(--accent)}.page-nav.left{left:14px}.page-nav.right{right:14px}.page-nav.disabled{opacity:.25;pointer-events:none}
.sheet{width:100%;max-width:820px;background:#0f0f11;color:#e5e7eb;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:44px;box-shadow:0 25px 60px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:18px;transition:.3s}
.sheet.is-cover{background:radial-gradient(circle at 50% 0%,#1c1c24 0%,#0f0f11 70%);text-align:center}.sheet.is-cover #globalTitle{text-align:center;font-family:'Playfair Display',serif;font-size:42px;letter-spacing:-1px;border-bottom:none}
.input-group{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px}.input-group label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;opacity:.6;font-weight:600;display:flex;justify-content:space-between}
.text-input{background:transparent;border:none;border-bottom:1px solid rgba(128,128,128,.2);color:inherit;font-size:24px;font-weight:600;font-family:inherit;padding:8px 0;outline:none}.text-input:focus{border-bottom-color:var(--accent)}
.meta-input{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:inherit;font-family:'Inter',sans-serif;font-size:13px;padding:10px 12px;border-radius:6px;outline:none;width:100%}
.meta-row{display:flex;gap:14px;flex-wrap:wrap}
.segment-group{display:flex;background:rgba(255,255,255,.06);border-radius:6px;padding:3px;border:1px solid rgba(255,255,255,.1)}.segment-btn{flex:1;background:transparent;color:inherit;opacity:.6;border:none;padding:7px;border-radius:4px;font-size:11px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:5px;transition:.2s}.segment-btn:hover{background:rgba(255,255,255,.1)}.segment-btn.active{background:#fff;color:#000;opacity:1;font-weight:600}
textarea.main{width:100%;min-height:360px;background:transparent;border:none;color:inherit;font-family:inherit;font-size:17px;line-height:1.85;resize:vertical;outline:none}
input[type=range]{width:100%;accent-color:var(--accent)}
.char-counter{font-size:11px;text-align:right;opacity:.6}
.btn-preview{position:fixed;bottom:22px;right:22px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border);color:var(--text);padding:12px 18px;border-radius:30px;font-size:13px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:30;display:flex;gap:8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(14px);display:none;justify-content:center;align-items:center;z-index:1000;padding:16px}.overlay.active{display:flex}
.modal{background:#111114;border:1px solid var(--border);border-radius:16px;width:100%;max-width:720px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.modal-body{padding:18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.preview-shell{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;height:100%;justify-content:center}
.preview-top{display:flex;gap:6px;background:#18181b;border:1px solid var(--border);padding:8px 12px;border-radius:30px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.preview-screen{background:#faf8f5;border-radius:24px;overflow:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.8);border:8px solid #222;transition:.3s}
.preview-screen.mobile{width:390px;height:700px}.preview-screen.tablet{width:768px;height:640px;border-radius:16px}.preview-screen.large{width:1024px;height:640px;border-radius:12px}
.preview-screen.epub{width:600px;height:780px;border-radius:8px;background:#fff;color:#111;border:6px solid #222}
.preview-screen.pdf{width:620px;height:860px;border-radius:4px;background:#fff;color:#111;border:6px solid #222}
.prv-content{padding:32px;color:#111;font-size:16px;line-height:1.75}.prv-title{font-size:2em;font-weight:700;margin-bottom:12px;text-align:center}.prv-text{position:relative;z-index:1;white-space:pre-wrap;text-align:justify}
.clearfix::after{content:"";clear:both;display:table}
.project-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,.03)}.project-item.active{border-color:var(--accent);background:rgba(34,211,238,.08)}
.upload{border:1px dashed var(--border);padding:12px;border-radius:8px;text-align:center;cursor:pointer}
.saved-toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(120px);background:#0f0f11;border:1px solid rgba(34,211,238,.35);color:#fff;padding:10px 18px;border-radius:30px;display:flex;align-items:center;gap:10px;z-index:3000;opacity:0;transition:all.45s cubic-bezier(.175,.885,.32,1.275)}.saved-toast.show{transform:translateX(-50%) translateY(0);opacity:1}.saved-gif{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;animation:pop.5s}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
/* Generate dropdown */
.gen-wrap{position:relative}
.dropdown-menu{position:absolute;top:110%;right:0;min-width:260px;background:#18181b;border:1px solid var(--border);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.6);padding:12px;z-index:100;display:flex;flex-direction:column;gap:8px}
.dropdown-section{padding:6px 4px}.dropdown-divider{height:1px;background:var(--border);margin:4px 0}
.dropdown-item{width:100%;justify-content:flex-start;background:transparent;border:1px solid transparent;padding:10px 12px;border-radius:8px;font-size:13px}.dropdown-item:hover{background:rgba(255,255,255,.06);border-color:var(--border)}
</style>
<style id="customFontsStyle"></style>
</head>
<body>
<div class="ribbon glass">
<div class="ribbon-group">
<div class="logo-txt"><div class="logo-main">The Pages.</div><div class="logo-sub">sources</div></div>
<div class="divider"></div>
<button class="btn btn-outline" onclick="openProjects()"><i class="fas fa-folder"></i> <span data-i18n="projects">Mes Projets</span></button>
<select id="pageSelector" onchange="onPageChange()"></select>
<button class="btn btn-outline" onclick="addPage()"><i class="fas fa-plus"></i></button>
<button class="btn btn-outline btn-danger" onclick="deletePage()"><i class="fas fa-trash"></i></button>
</div>
<div class="ribbon-group">
<div class="sync" id="syncIndicator"><i class="fas fa-check-circle"></i> sync</div>
<div class="divider"></div>
<select id="fontSelector" onchange="changeFont()"></select>
<button class="btn btn-outline" onclick="openSettings()"><i class="fas fa-cog"></i></button>
<div class="gen-wrap">
<button class="btn btn-primary" id="generateBtn" onclick="toggleGenerateMenu()"><i class="fas fa-bolt"></i> <span data-i18n="generate">Generate</span> <i class="fas fa-chevron-down" style="font-size:9px"></i></button>
<div id="generateDropdown" class="dropdown-menu" style="display:none">
<div class="dropdown-section"><div style="font-size:10px;opacity:.5;text-transform:uppercase" data-i18n="currentProject">Projet Actuel</div><div id="genCurrentProjectName" style="font-weight:700;margin-top:6px">-</div></div>
<div class="dropdown-divider"></div>
<button class="dropdown-item" onclick="openProjects(); closeGenerateMenu()"><i class="fas fa-folder-open"></i> <span data-i18n="chooseProject">Choisir un autre projet</span></button>
<div class="dropdown-divider"></div>
<div style="font-size:10px;opacity:.5;text-transform:uppercase;margin:4px" data-i18n="download">Télécharger</div>
<button class="dropdown-item" onclick="exportPagesData(); closeGenerateMenu()"><i class="fas fa-code"></i> pages.data</button>
<button class="dropdown-item" onclick="exportEPUB3(); closeGenerateMenu()"><i class="fas fa-book-open"></i> EPUB3</button>
<button class="dropdown-item" onclick="exportPDFBook(); closeGenerateMenu()"><i class="fas fa-file-pdf"></i> PDF Livre</button>
</div>
</div>
<button class="btn btn-outline" onclick="manualSave()"><i class="fas fa-save"></i> <span data-i18n="save">Save</span></button>
</div>
</div>

<div class="main-body">
<div class="sidebar"><div class="sidebar-scroll">
<div class="cat" data-i18n="reading">Lecture</div>
<div class="menu-item active" id="tab-book" onclick="setMode('book')"><i class="fas fa-book-open"></i> <span data-i18n="book">Livre (Poche)</span></div>
<div class="menu-item" id="tab-bd" onclick="setMode('bd')"><i class="fas fa-mask"></i> <span data-i18n="comic">Bande Dessinée</span></div>
<div class="menu-item" id="tab-enfant" onclick="setMode('enfant')"><i class="fas fa-child"></i> <span data-i18n="kids">Livre Enfant</span></div>
<div class="cat" data-i18n="editions">Éditions</div>
<div class="menu-item" id="tab-magazine" onclick="setMode('magazine')"><i class="fas fa-th-large"></i> <span data-i18n="magazine">Magazine</span></div>
<div class="menu-item" id="tab-journal" onclick="setMode('journal')"><i class="far fa-newspaper"></i> <span data-i18n="newspaper">Journal</span></div>
<div class="cat" data-i18n="currentProject">Projet Actuel</div>
<div style="padding:0 16px 10px;font-size:12px;color:var(--accent)" id="currentProjectName">-</div>
</div></div>

<div class="workspace" id="workspace">
<div class="page-nav left" id="navLeft" onclick="prevPage()"><i class="fas fa-chevron-left"></i></div>
<div class="page-nav right" id="navRight" onclick="nextPage()"><i class="fas fa-chevron-right"></i></div>
<div class="sheet" id="sheet">
<div class="input-group"><label data-i18n="workTitle">Titre de l'œuvre</label><input id="globalTitle" class="text-input" data-i18n-ph="workTitlePh" placeholder="Ex: Mon Chef-d'œuvre" oninput="autoSave()"></div>
<div id="authorMetaSection" style="display:none;flex-direction:column;gap:14px">
<div class="meta-row"><div class="input-group"><label data-i18n="author">Auteur</label><input id="globalAuthor" class="meta-input" data-i18n-ph="authorPh" placeholder="Ex: Victor Hugo" oninput="autoSave()"></div><div class="input-group"><label data-i18n="date">Date</label><input id="globalDate" type="date" class="meta-input" oninput="autoSave()"></div></div>
<div class="meta-row"><div class="input-group"><label data-i18n="publisher">Éditeur</label><input id="globalPublisher" class="meta-input" data-i18n-ph="publisherPh" placeholder="Ex: Gallimard" oninput="autoSave()"></div><div class="input-group"><label data-i18n="genre">Genre du livre</label><input id="globalGenre" class="meta-input" data-i18n-ph="genrePh" placeholder="Ex: Roman" oninput="autoSave()"></div></div>
</div>
<div class="meta-row"><div class="input-group" style="flex:2"><label data-i18n="chapterTitle">Nom de la page</label><input id="itemTitle" class="meta-input" style="font-weight:700" data-i18n-ph="chapterPh" placeholder="Book Cover, Page Auteur..." oninput="autoSave()"></div></div>
<div class="meta-row">
<div class="input-group" style="flex:2"><label data-i18n="image">Illustration (URL)</label><input id="itemImage" class="meta-input" placeholder="https://..." oninput="autoSave()"></div>
<div class="input-group" style="flex:1"><label data-i18n="layout">Disposition verticale</label>
<div class="segment-group">
<button class="segment-btn active" id="lay-top" onclick="setLayout('top')"><i class="fas fa-arrow-up"></i></button>
<button class="segment-btn" id="lay-center" onclick="setLayout('center')"><i class="fas fa-align-center"></i></button>
<button class="segment-btn" id="lay-bottom" onclick="setLayout('bottom')"><i class="fas fa-arrow-down"></i></button>
<button class="segment-btn" id="lay-bg" onclick="setLayout('bg')"><i class="fas fa-image"></i></button>
</div></div>
<div class="input-group" style="flex:1"><label>Alignement Image</label>
<div class="segment-group">
<button class="segment-btn active" id="align-center" onclick="setImageAlign('center')"><i class="fas fa-align-center"></i></button>
<button class="segment-btn" id="align-left" onclick="setImageAlign('left')"><i class="fas fa-align-left"></i></button>
<button class="segment-btn" id="align-right" onclick="setImageAlign('right')"><i class="fas fa-align-right"></i></button>
</div></div>
</div>
<div class="meta-row">
<div class="input-group"><label><span data-i18n="imageSize">Taille image</span> <span id="imageSizeVal">70%</span></label><input type="range" id="imageSize" min="20" max="100" value="70" oninput="updateImageSize(this.value)"></div>
<div class="input-group" id="bgOpacityGroup" style="display:none"><label><span data-i18n="bgOpacity">Transparence du fond</span> <span id="bgOpacityVal">15%</span></label><input type="range" id="bgOpacity" min="5" max="100" value="15" oninput="updateBgOpacity(this.value)"></div>
</div>
<div class="input-group" style="flex:1"><label><span data-i18n="body">Corps du texte</span> <span id="charCounterLabel"></span></label><textarea id="itemText" class="main" data-i18n-ph="bodyPh" placeholder="Commencez à écrire..." oninput="autoSave()"></textarea><div id="charCounter" class="char-counter">0 / 1500</div></div>
</div>
<button class="btn-preview" onclick="openPreview()"><i class="fas fa-eye"></i> <span data-i18n="preview">Aperçu & Export</span></button>
</div>
</div>

<div class="overlay" id="previewModal" onclick="if(event.target===this)closePreview()">
<div class="preview-shell" onclick="event.stopPropagation()">
<div class="preview-top">
<button class="btn btn-outline" id="btnMobile" onclick="setPreviewDevice('mobile')"><i class="fas fa-mobile-alt"></i> Mobile</button>
<button class="btn btn-outline" id="btnTablet" onclick="setPreviewDevice('tablet')"><i class="fas fa-tablet-alt"></i> Tablette</button>
<button class="btn btn-outline" id="btnLarge" onclick="setPreviewDevice('large')"><i class="fas fa-desktop"></i> Large</button>
<button class="btn btn-outline" id="btnEpub" onclick="setPreviewDevice('epub')"><i class="fas fa-book-open"></i> EPUB</button>
<button class="btn btn-outline" id="btnPdf" onclick="setPreviewDevice('pdf')"><i class="fas fa-file-pdf"></i> PDF</button>
<button class="btn btn-primary" onclick="closePreview()"><i class="fas fa-times"></i></button>
</div>
<div class="preview-screen mobile" id="previewScreen"><div class="prv-content" id="prvContent"></div></div>
</div>
</div>

<div class="overlay" id="projectsModal"><div class="modal"><div class="modal-head"><h3><i class="fas fa-folder-open"></i> <span data-i18n="projects">Mes Projets</span></h3><button class="btn" onclick="closeProjects()"><i class="fas fa-times"></i></button></div>
<div class="modal-body"><div style="display:flex;gap:8px"><input id="newProjectTitle" class="meta-input" data-i18n-ph="newBookPlaceholder" placeholder="Titre..." style="flex:1"><button class="btn btn-primary" onclick="createNewProject()"><i class="fas fa-plus"></i> <span data-i18n="newBook">Nouveau Livre</span></button></div><div id="projectsList" style="display:flex;flex-direction:column;gap:8px"></div></div></div></div>

<div class="overlay" id="settingsModal"><div class="modal"><div class="modal-head"><h3><i class="fas fa-cog"></i> <span data-i18n="settings">Paramètres</span></h3><button class="btn" onclick="closeSettings()"><i class="fas fa-times"></i></button></div>
<div class="modal-body">
<div><label style="font-size:11px;text-transform:uppercase;opacity:.6" data-i18n="language">Langue</label><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-outline" id="lang-fr" onclick="setLang('fr')">FR</button><button class="btn btn-outline" id="lang-en" onclick="setLang('en')">EN</button></div></div>
<div><label style="font-size:11px;text-transform:uppercase;opacity:.6" data-i18n="fonts">Polices</label><div id="fontsList" style="display:flex;flex-direction:column;gap:6px;margin-top:8px"></div><div class="upload" style="margin-top:10px" onclick="document.getElementById('fontFileInput').click()"><i class="fas fa-upload"></i> <span data-i18n="fontsHint">Importer police</span><input type="file" id="fontFileInput" accept=".ttf,.otf,.woff,.woff2" style="display:none" onchange="handleFontUpload(event)"></div></div>

<div style="border-top:1px solid var(--border);padding-top:14px"><button class="btn btn-outline btn-danger" style="width:100%;justify-content:center" onclick="factoryReset()"><i class="fas fa-trash-alt"></i> <span data-i18n="factoryReset">Factory Reset</span></button></div>
</div></div></div>

<div id="savedToast" class="saved-toast"><div class="saved-gif">✓</div><span data-i18n="saved">Enregistré!</span></div>

<script>

function splitCenter(t){ if(!t||t.length<60) return [t,'']; const mid=Math.floor(t.length/2); let idx=t.indexOf('\n\n',mid-80); if(idx===-1) idx=t.lastIndexOf('. ',mid); if(idx===-1) idx=mid; return [t.slice(0,idx).trim(), t.slice(idx).trim()]; }

function generateImgHtml(item){
 if(!item.image) return '';
 const size=item.imageSize||70; const align=item.imageAlign||'center'; const opacity=(item.bgOpacity||15)/100;
 if(item.layout==='bg'){
  return `<img src="${item.image}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:${opacity};z-index:0" />`;
 }
 let style=`width:${size}%;max-width:100%;`;
 if(align==='left') style+=`float:left;margin:0 20px 12px 0;`;
 else if(align==='right') style+=`float:right;margin:0 0 12px 20px;`;
 else style+=`display:block;margin:16px auto;`;
 return `<div style="${style}"><img src="${item.image}" style="width:100%;height:auto;border-radius:8px;display:block" /></div>`;
}
function buildPageHTML(item, projectTitle){
 const text=escXml(item.text||''); let titleHTML='';
 if(item.type==='cover'){
  titleHTML=`<h1 style="text-align:center;font-family:'Playfair Display';font-size:2.4em;margin:30px 0 10px">${escXml(projectTitle||item.title)}</h1>`;
 }else{
  if(item.title) titleHTML=`<h1 style="font-size:1.8em;font-weight:700;text-align:center;margin-bottom:10px">${escXml(item.title)}</h1>`;
  if(item.type==='author'){
   const meta=[item.author,item.date,item.publisher,item.genre].filter(Boolean).map(escXml).join(' · ');
   if(meta) titleHTML+=`<div style="text-align:center;opacity:.6;font-size:.9em;margin-bottom:16px">${meta}</div>`;
  }
 }
 const img=generateImgHtml(item);
 if(item.layout==='bg'){
  return `<div style="position:relative;min-height:380px;overflow:hidden;border-radius:10px;padding:20px">${img}<div style="position:relative;z-index:1" class="clearfix">${titleHTML}<div style="white-space:pre-wrap;text-align:justify">${text}</div></div></div>`;
 }
 if(item.layout==='top'){
  return `<div class="clearfix">${img}${titleHTML}<div style="white-space:pre-wrap;text-align:justify">${text}</div></div>`;
 }
 if(item.layout==='bottom'){
  return `<div class="clearfix">${titleHTML}<div style="white-space:pre-wrap;text-align:justify">${text}</div>${img}<div style="clear:both"></div></div>`;
 }
 const [a,b]=splitCenter(item.text||'');
 return `<div class="clearfix">${titleHTML}<div style="white-space:pre-wrap;text-align:justify">${escXml(a)}</div>${img}<div style="white-space:pre-wrap;text-align:justify;clear:${item.imageAlign==='center'?'both':'none'};padding-top:8px">${escXml(b)}</div><div style="clear:both"></div></div>`;
}

  let manifest=`<item id="css" href="css/style.css" media-type="text/css"/>\n<item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>`;
  let spine=``; let navOl=``; const files=[];
  const items=proj.data[currentMode]?.items||[];
  items.forEach((it,i)=>{
   const id=`c${i}`; const fn=`chapter-${i}.xhtml`;
   manifest+=`\n<item id="${id}" href="${fn}" media-type="application/xhtml+xml"/>`; spine+=`\n<itemref idref="${id}"/>`;
   const html=buildPageHTML(it, proj.title);
   const xhtml=`<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xml:lang="${lang}"><head><meta charset="utf-8"/><title>${escXml(it.title||'')}</title><link rel="stylesheet" href="css/style.css"/></head><body>${html}</body></html>`;
   files.push({fn,c:xhtml}); navOl+=`<li><a href="${fn}">${escXml(it.title||'Chapitre '+i)}</a></li>`;
  });
  const opf=`<?xml version="1.0"?><package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="bookid" xml:lang="${lang}"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:identifier id="bookid">${uuid}</dc:identifier><dc:title>${escXml(title)}</dc:title><dc:creator>${escXml(author)}</dc:creator><dc:language>${lang}</dc:language><dc:publisher>${escXml(publisher)}</dc:publisher></metadata><manifest>${manifest}</manifest><spine><itemref idref="nav"/>${spine}</spine></package>`;
  oebps.file("content.opf",opf);
  oebps.file("nav.xhtml",`<?xml version="1.0"?><html xmlns="http://www.w3.org/1999/xhtml"><head><meta charset="utf-8"/><title>TOC</title><link rel="stylesheet" href="css/style.css"/></head><body><nav epub:type="toc"><ol>${navOl}</ol></nav></body></html>`);
  files.forEach(f=>oebps.file(f.fn,f.c));
  const blob=await zip.generateAsync({type:"blob",mimeType:"application/epub+zip",compression:"DEFLATE"});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=(title.replace(/[^a-z0-9]/gi,'_')+'.epub'); a.click(); URL.revokeObjectURL(url);
 }catch(e){ alert('EPUB error: '+e.message); console.error(e); }finally{ btn.innerHTML=old; btn.disabled=false; }
}
async function exportPDFBook(){
 autoSave(); const proj=getCurrentProject(); if(!proj) return;
 const items=proj.data[currentMode]?.items||[];
 const container=document.createElement('div'); container.style.background='#fff'; container.style.color='#111'; container.style.padding='20px'; container.style.fontFamily=fontMapping[appConfig.fontFamily]||'serif';
 let html='';
 items.forEach(it=>{
  html+=`<div style="page-break-after:always;padding:20px 0">${buildPageHTML(it, proj.title)}</div>`;
 });
 container.innerHTML=html; document.body.appendChild(container);
 const btn=document.querySelector('[onclick="exportPDFBook()"]'); const old=btn.innerHTML; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>'; btn.disabled=true;
 try{
  const opt={margin:10,filename:(proj.title||'livre')+'.pdf',image:{type:'jpeg',quality:0.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a5',orientation:'portrait'}};
  await html2pdf().set(opt).from(container).save();
 }catch(e){ alert('PDF error: '+e.message); }finally{ container.remove(); btn.innerHTML=old; btn.disabled=false; }
}
function manualSave(){ autoSave(); }
window.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closePreview(); closeSettings(); closeProjects(); closeGenerateMenu(); } if(e.key==='ArrowLeft' &&!e.target.matches('input, textarea')) prevPage(); if(e.key==='ArrowRight' &&!e.target.matches('input, textarea')) nextPage(); });
window.onload=()=>{ loadCustomFonts(); loadProjects(); refreshFontSelector(); applyI18n(); loadProjectIntoUI(); };
</script>
