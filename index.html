<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writer. · The Pages. Sources</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-app: #1e1e24; 
            --bg-ribbon: #2b2b36;
            --bg-sidebar: #25252f;
            --text-ui: #ffffff;
            --text-muted: #9ca3af;
            --border-color: #3f3f4e;
            --accent: #06b6d4;
            
            /* Thèmes de la feuille */
            --sheet-nuit: #121212; --sheet-text-nuit: #e6e6e6;
            --sheet-creme: #ffffff; --sheet-text-creme: #111111;
            --sheet-papier: #f4ecd8; --sheet-text-papier: #433422;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-app); color: var(--text-ui); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* RUBAN */
        .ribbon { width: 100%; height: 70px; background-color: var(--bg-ribbon); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; }
        .ribbon-left { display: flex; align-items: center; gap: 20px; }
        .ribbon-right { display: flex; align-items: center; gap: 12px; }
        
        .logo-text { font-family: 'Newsreader', serif; font-size: 24px; font-weight: 700; font-style: italic; color: #ffffff; letter-spacing: -0.5px; }
        .logo-text span { color: var(--accent); font-family: 'Inter', sans-serif; font-size: 11px; font-style: normal; text-transform: uppercase; letter-spacing: 1px; margin-left: 8px;}
        
        .toolbar { display: flex; align-items: center; gap: 10px; border-left: 1px solid var(--border-color); padding-left: 20px; }
        .toolbar-divider { width: 1px; height: 30px; background-color: var(--border-color); margin: 0 5px; }
        
        select, .btn { background: var(--bg-app); color: var(--text-ui); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; outline: none; }
        .btn:hover { background: #3f3f4e; }
        .btn-icon { padding: 8px; border-radius: 6px; width: 34px; height: 34px; justify-content: center; }
        
        .btn-green { background: #10b981; color: white; border: none; } .btn-green:hover { background: #059669; }
        .btn-blue { color: #3b82f6; border-color: rgba(59, 130, 246, 0.4); } .btn-blue:hover { background: rgba(59, 130, 246, 0.1); border-color: #3b82f6; }
        .btn-danger { color: #ef4444; } .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }
        .btn-new { color: #eab308; border-color: rgba(234, 179, 8, 0.4); } .btn-new:hover { background: rgba(234, 179, 8, 0.1); border-color: #eab308; }

        .font-tool { display: flex; align-items: center; gap: 5px; background: var(--bg-app); padding: 2px 2px 2px 10px; border-radius: 6px; border: 1px solid var(--border-color); }
        .font-tool i { font-size: 14px; color: var(--text-muted); }
        .font-tool select { border: none; background: transparent; padding: 6px; color: white; outline: none; font-size: 13px; }
        
        /* Indicateur Sync */
        .sync-indicator { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; padding-right: 5px; }
        .sync-indicator i { font-size: 11px; }
        .sync-indicator.synced i { color: #10b981; }
        .sync-indicator.saving i { color: #f59e0b; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* CORPS & SIDEBAR */
        .main-body { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 220px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }
        .menu-category { font-size: 11px; text-transform: uppercase; color: var(--text-muted); padding: 15px 20px 5px 20px; letter-spacing: 1px; font-weight: 700; }
        .menu-item { padding: 10px 20px; display: flex; align-items: center; gap: 12px; color: var(--text-muted); cursor: pointer; transition: 0.2s; font-size: 13px; font-weight: 500; border-left: 3px solid transparent; }
        .menu-item:hover { color: var(--text-ui); background: rgba(255,255,255,0.03); }
        .menu-item.active { color: var(--accent); background: rgba(6, 182, 212, 0.05); border-left: 3px solid var(--accent); }

        /* WORKSPACE */
        .workspace { flex: 1; background-color: #17171c; padding: 40px 20px; overflow-y: auto; display: flex; justify-content: center; align-items: flex-start; position: relative; }
        
        .writing-sheet { width: 100%; max-width: 800px; background: var(--sheet-nuit); color: var(--sheet-text-nuit); border-radius: 8px; padding: 50px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 24px; transition: background 0.3s, color 0.3s; border: 1px solid rgba(128,128,128,0.1); }
        
        /* Thèmes CSS */
        body[data-theme="creme"] .writing-sheet { background: var(--sheet-creme); color: var(--sheet-text-creme); }
        body[data-theme="papier"] .writing-sheet { background: var(--sheet-papier); color: var(--sheet-text-papier); }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; font-weight: 700; font-family: 'Inter', sans-serif; color: inherit;}
        
        input.text-input { background: transparent; border: none; border-bottom: 1px solid rgba(128,128,128,0.2); color: inherit; font-size: 22px; font-weight: 700; font-family: inherit; padding: 5px 0; outline: none; }
        input.meta-input { background: rgba(128,128,128,0.05); border: 1px solid rgba(128,128,128,0.2); color: inherit; font-family: 'Inter', sans-serif; font-size: 14px; padding: 12px; border-radius: 6px; outline: none; width: 100%; }
        input.meta-input:focus { border-color: var(--accent); }
        
        textarea.main-textarea { width: 100%; flex: 1; min-height: 400px; background: transparent; border: 1px dashed rgba(128,128,128,0.2); border-radius: 6px; padding: 15px; color: inherit; font-family: inherit; font-size: 17px; line-height: 1.7; resize: vertical; outline: none; transition: 0.2s; }
        textarea.main-textarea:focus { border-color: var(--accent); }
        
        .meta-row { display: flex; gap: 20px; flex-wrap: wrap; }
        .meta-row .input-group { flex: 1; min-width: 200px; }

        /* Segments Layout Image */
        .segment-group { display: flex; background: rgba(128,128,128,0.08); border-radius: 6px; padding: 4px; border: 1px solid rgba(128,128,128,0.2); }
        .segment-btn { flex: 1; background: transparent; color: inherit; opacity: 0.6; border: none; padding: 8px 5px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 4px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .segment-btn.active { background: rgba(128,128,128,0.2); opacity: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.1); color: var(--accent); }

        /* PREVIEW MODAL */
        .btn-preview { position: fixed; bottom: 30px; right: 40px; background: var(--accent); color: white; border: none; padding: 15px 25px; border-radius: 30px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 10px 20px rgba(6, 182, 212, 0.3); display: flex; align-items: center; gap: 10px; transition: 0.2s; z-index: 100;}
        .btn-preview:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(6, 182, 212, 0.4); }

        .preview-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .preview-overlay.active { display: flex; }
        
        .preview-container { background: var(--bg-ribbon); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; border: 1px solid var(--border-color); max-height: 95vh; }
        .preview-controls { display: flex; gap: 10px; background: var(--bg-app); padding: 5px; border-radius: 8px; }
        .preview-controls button { background: transparent; border: none; color: var(--text-muted); padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .preview-controls button.active { background: var(--border-color); color: white; }
        
        /* Ajustements de taille pour Mobile/Tablette */
        .preview-screen { background: #faf8f5; border-radius: 12px; overflow-y: auto; overflow-x: hidden; position: relative; transition: width 0.3s, height 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .preview-screen.mobile { width: 340px; height: 600px; }
        .preview-screen.tablet { width: 600px; height: 800px; max-height: 80vh;}

        /* Contenu du Preview - Tailles réduites pour écran mobile */
        .prv-content { padding: 20px; color: #111; font-size: 15px; line-height: 1.6; }
        .prv-title { font-size: 1.6em; font-weight: bold; margin-bottom: 15px; line-height: 1.2; text-align: left;}
        .prv-img { width: 100%; max-height: 250px; object-fit: contain; border-radius: 8px; margin-bottom: 15px; }
        .prv-img.bg-mode { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.2; object-fit: cover; border-radius: 0; max-height: none; }
        .prv-text { position: relative; z-index: 1; white-space: pre-wrap; text-align: justify;}
    </style>
</head>
<body data-theme="nuit">

    <!-- RUBAN DU HAUT -->
    <div class="ribbon">
        <div class="ribbon-left">
            <div class="logo-text">The Pages.<span>Sources</span></div>
            
            <div class="toolbar">
                <button class="btn btn-new" onclick="createNewProject()" title="Commencer un nouveau livre"><i class="fas fa-file-medical"></i> <span data-i18n="btnNewProject">Nouveau</span></button>
                <div class="toolbar-divider"></div>
                
                <select id="pageSelector" onchange="loadPageData()"></select>
                <button class="btn" onclick="addPage()"><i class="fas fa-plus"></i> <span data-i18n="newBtn">Page</span></button>
                <button class="btn btn-icon btn-danger" onclick="deletePage()" title="Supprimer la page"><i class="fas fa-trash"></i></button>
                
                <div class="toolbar-divider"></div>
                
                <!-- SELECTEUR DE POLICES (De retour !) -->
                <div class="font-tool" title="Police du livre">
                    <i class="fas fa-font"></i>
                    <select id="fontSelector" onchange="changeFont()">
                        <option value="Newsreader">Newsreader</option>
                        <option value="Lora">Lora</option>
                        <option value="Merriweather">Merriweather</option>
                        <option value="EB Garamond">Garamond</option>
                        <option value="Inter">Inter (Moderne)</option>
                    </select>
                </div>

                <!-- SELECTEUR DE THEME (De retour !) -->
                <button class="btn btn-icon" onclick="cycleTheme()" title="Changer de thème (Protection des yeux)"><i class="fa-solid fa-circle-half-stroke"></i></button>
                
                <div class="toolbar-divider"></div>
                <button class="btn" onclick="toggleLang()" id="langBtn">EN</button>
            </div>
        </div>
        
        <div class="ribbon-right">
            <!-- INDICATEUR DE SYNCHRONISATION -->
            <div class="sync-indicator synced" id="syncIndicator">
                <i class="fas fa-sync-alt"></i><span id="syncText" data-i18n="lblSync">Sync</span>
            </div>
            
            <div class="toolbar-divider" style="height:30px;"></div>

            <input type="file" id="importWorkInput" accept=".writerwork,.json" style="display:none" onchange="importWorkflow(event)">
            <button class="btn" onclick="document.getElementById('importWorkInput').click()"><i class="fas fa-folder-open"></i> <span data-i18n="btnImport">Import</span></button>
            <button class="btn" onclick="exportWorkflow()"><i class="fas fa-archive"></i> <span data-i18n="btnBackup">Backup</span></button>
            <button class="btn btn-blue" onclick="manualSave()"><i class="fas fa-save"></i> <span data-i18n="btnSave">Save</span></button>
            
            <div class="toolbar-divider" style="height:30px;"></div>

            <button class="btn btn-green" onclick="exportPagesData()"><i class="fas fa-download"></i> pages.data</button>
        </div>
    </div>

    <div class="main-body">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="menu-category" data-i18n="catReading">Lecture</div>
            <div class="menu-item active" id="tab-book" onclick="setMode('book')"><i class="fas fa-book"></i> <span data-i18n="menuBook">Livre (Poche)</span></div>
            <div class="menu-item" id="tab-bd" onclick="setMode('bd')"><i class="fas fa-mask"></i> <span data-i18n="menuBd">Bande Dessinée</span></div>
            <div class="menu-item" id="tab-enfant" onclick="setMode('enfant')"><i class="fas fa-child"></i> <span data-i18n="menuKid">Livre Enfant</span></div>
            
            <div class="menu-category" data-i18n="catEdition">Éditions</div>
            <div class="menu-item" id="tab-magazine" onclick="setMode('magazine')"><i class="fas fa-th-large"></i> <span data-i18n="menuMag">Magazine</span></div>
            <div class="menu-item" id="tab-journal" onclick="setMode('journal')"><i class="far fa-newspaper"></i> <span data-i18n="menuNews">Journal</span></div>
        </div>

        <!-- WORKSPACE : ÉDITEUR -->
        <div class="workspace">
            <div class="writing-sheet">
                
                <div class="input-group" style="padding-bottom: 20px; border-bottom: 1px dashed rgba(128,128,128,0.3);">
                    <label data-i18n="lblAppTitle">Titre global du Livre / Projet</label>
                    <input type="text" id="globalTitle" class="text-input" data-i18n-ph="phGlobalTitle" placeholder="Ex: Mon Livre Magique" oninput="autoSave()">
                </div>

                <div class="meta-row">
                    <div class="input-group">
                        <label data-i18n="lblPageTitle">Titre de la page</label>
                        <input type="text" id="itemTitle" class="meta-input" data-i18n-ph="phPageTitle" placeholder="Chapitre 1..." style="font-size: 18px; font-weight:bold; font-family:inherit;" oninput="autoSave()">
                    </div>
                </div>

                <div class="meta-row">
                    <div class="input-group" style="flex:2;">
                        <label data-i18n="lblImage">URL de l'image</label>
                        <input type="text" id="itemImage" class="meta-input" placeholder="https://..." oninput="autoSave()">
                    </div>
                    <!-- POSITION DE L'IMAGE AVEC LE CENTRE -->
                    <div class="input-group" style="flex:1;">
                        <label data-i18n="lblLayout">Position Image</label>
                        <div class="segment-group">
                            <button class="segment-btn active" id="lay-top" onclick="setLayout('top')" title="Haut"><i class="fas fa-arrow-up"></i></button>
                            <button class="segment-btn" id="lay-center" onclick="setLayout('center')" title="Centre"><i class="fas fa-align-center"></i></button>
                            <button class="segment-btn" id="lay-bottom" onclick="setLayout('bottom')" title="Bas"><i class="fas fa-arrow-down"></i></button>
                            <button class="segment-btn" id="lay-bg" onclick="setLayout('bg')" title="Fond"><i class="fas fa-image"></i></button>
                        </div>
                    </div>
                </div>

                <div class="input-group" style="flex:1;">
                    <label data-i18n="lblText">Contenu</label>
                    <textarea id="itemText" class="main-textarea" data-i18n-ph="phText" placeholder="Commencez à écrire..." oninput="autoSave()"></textarea>
                </div>
            </div>
            
            <button class="btn-preview" onclick="openPreview()"><i class="fas fa-eye"></i> <span data-i18n="btnPreview">Aperçu</span></button>
        </div>
    </div>

    <!-- PREVIEW MODAL -->
    <div class="preview-overlay" id="previewModal">
        <div class="preview-container">
            <div class="preview-controls">
                <button class="active" onclick="setPreviewSize('mobile', this)"><i class="fas fa-mobile-alt"></i></button>
                <button onclick="setPreviewSize('tablet', this)"><i class="fas fa-tablet-alt"></i></button>
                <button onclick="closePreview()" style="margin-left: 20px; color: #ef4444;"><i class="fas fa-times"></i></button>
            </div>
            <div class="preview-screen mobile" id="previewScreen">
                <div class="prv-content" id="prvContent"></div>
            </div>
        </div>
    </div>

    <script>
        // --- DICTIONNAIRES ---
        const i18n = {
            fr: {
                catReading: "Lecture", menuBook: "Livre (Poche)", menuBd: "Bande Dessinée", menuKid: "Livre Enfant",
                catEdition: "Éditions", menuMag: "Magazine", menuNews: "Journal",
                newBtn: "Page", btnPreview: "Aperçu de la page", btnNewProject: "Nouveau",
                btnSave: "Sauvegarder", btnBackup: "Backup", btnImport: "Import", lblSync: "Sync",
                lblAppTitle: "Titre global du Livre / Projet", lblPageTitle: "Titre de la page", lblImage: "URL de l'image (Optionnel)", lblLayout: "Position Image", lblText: "Contenu du texte",
                phGlobalTitle: "Ex: Mon Livre Magique", phPageTitle: "Chapitre 1, Couverture...", phText: "Commencez à écrire..."
            },
            en: {
                catReading: "Reading", menuBook: "Pocket Book", menuBd: "Comic Book", menuKid: "Children's Book",
                catEdition: "Publishing", menuMag: "Magazine", menuNews: "Newspaper",
                newBtn: "Page", btnPreview: "Page Preview", btnNewProject: "New Project",
                btnSave: "Save", btnBackup: "Backup", btnImport: "Import", lblSync: "Sync",
                lblAppTitle: "Global Book / Project Title", lblPageTitle: "Page Title", lblImage: "Image URL (Optional)", lblLayout: "Image Layout", lblText: "Text Content",
                phGlobalTitle: "Ex: My Masterpiece", phPageTitle: "Chapter 1, Cover...", phText: "Start writing..."
            }
        };

        const fontMapping = {
            'Newsreader': "'Newsreader', serif", 
            'Inter': "'Inter', sans-serif",
            'EB Garamond': "'EB Garamond', serif", 
            'Lora': "'Lora', serif",
            'Merriweather': "'Merriweather', serif"
        };

        let currentLang = 'fr';
        let appConfig = { fontFamily: 'Newsreader', theme: 'nuit' };
        let themes = ['nuit', 'creme', 'papier'];
        let currentThemeIndex = 0;
        
        let defaultData = {
            book: { title: "", items: [{ id: 'cover', title: 'Couverture', image: '', layout: 'top', text: '' }, { id: '1', title: 'Chapitre 1', image: '', layout: 'top', text: '' }] },
            bd: { title: "", items: [{ id: '1', title: 'Planche 1', image: '', layout: 'bg', text: '' }] },
            magazine: { title: "", items: [{ id: '1', title: 'Article 1', image: '', layout: 'top', text: '' }] },
            journal: { title: "", items: [{ id: '1', title: 'News 1', image: '', layout: 'top', text: '' }] },
            enfant: { title: "", items: [{ id: '1', title: 'Page 1', image: '', layout: 'top', text: '' }] }
        };

        let appData = JSON.parse(JSON.stringify(defaultData));
        let currentMode = 'book';
        let currentPageId = 'cover';
        let saveTimeout = null;

        // --- NOUVEAU PROJET ---
        function createNewProject() {
            const msg = currentLang === 'fr' 
                ? "Attention : Cela va effacer votre livre actuel pour en commencer un nouveau. Avez-vous fait un Backup ?" 
                : "Warning: This will clear your current book to start a new one. Did you make a Backup?";
            
            if(confirm(msg)) {
                appData = JSON.parse(JSON.stringify(defaultData));
                document.getElementById('globalTitle').value = '';
                setMode('book');
                saveSession();
            }
        }

        // --- SYNCHRONISATION ---
        function setSyncStatus(status) {
            const indicator = document.getElementById('syncIndicator');
            indicator.className = 'sync-indicator ' + status;
        }

        // --- POLICES ET THÈMES ---
        function changeFont() {
            const fontName = document.getElementById('fontSelector').value;
            appConfig.fontFamily = fontName;
            applyFont(fontName);
            saveSession();
        }

        function applyFont(fontName) {
            const cssFont = fontMapping[fontName] || fontMapping['Newsreader'];
            document.getElementById('itemText').style.fontFamily = cssFont;
            document.getElementById('itemTitle').style.fontFamily = cssFont;
            document.getElementById('globalTitle').style.fontFamily = cssFont;
        }

        function cycleTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            const theme = themes[currentThemeIndex];
            appConfig.theme = theme;
            document.body.setAttribute('data-theme', theme);
            saveSession();
        }

        // --- UI & MODES ---
        function setMode(mode) {
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + mode).classList.add('active');
            
            currentMode = mode;
            document.getElementById('globalTitle').value = appData[mode].title || '';
            refreshSelector();
        }

        function refreshSelector() {
            const selector = document.getElementById('pageSelector');
            selector.innerHTML = '';
            const items = appData[currentMode].items;
            
            items.forEach((item, index) => {
                const opt = document.createElement('option');
                opt.value = item.id;
                opt.text = item.title || `Page ${index + 1}`;
                selector.appendChild(opt);
            });
            
            if(!items.find(i => i.id === currentPageId) && items.length > 0) currentPageId = items[0].id;
            if(currentPageId) { selector.value = currentPageId; loadPageData(); }
        }

        function loadPageData() {
            const item = appData[currentMode].items.find(i => i.id === currentPageId);
            if(!item) return;
            
            document.getElementById('itemTitle').value = item.title || '';
            document.getElementById('itemImage').value = item.image || '';
            document.getElementById('itemText').value = item.text || '';
            
            setLayout(item.layout || 'top', false);
        }

        function setLayout(layoutStr, doSave = true) {
            document.querySelectorAll('.segment-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('lay-' + layoutStr).classList.add('active');
            if(doSave) autoSave();
        }

        function autoSave() {
            if(!currentPageId) return;
            setSyncStatus('saving');
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                appData[currentMode].title = document.getElementById('globalTitle').value;
                let item = appData[currentMode].items.find(i => i.id === currentPageId);
                if(item) {
                    item.title = document.getElementById('itemTitle').value;
                    item.image = document.getElementById('itemImage').value;
                    item.text = document.getElementById('itemText').value;
                    item.layout = document.querySelector('.segment-btn.active').id.replace('lay-', '');
                    
                    const opt = document.getElementById('pageSelector').querySelector(`option[value="${currentPageId}"]`);
                    if(opt) opt.text = item.title || `Page`;
                }
                saveSession();
            }, 500);
        }

        function addPage() {
            const newId = 'page_' + Date.now();
            appData[currentMode].items.push({ id: newId, title: `Nouvelle Page`, image: '', layout: 'top', text: '' });
            currentPageId = newId;
            saveSession(); refreshSelector();
        }

        function deletePage() {
            if(appData[currentMode].items.length <= 1) return;
            appData[currentMode].items = appData[currentMode].items.filter(i => i.id !== currentPageId);
            saveSession(); refreshSelector();
        }

        // --- PREVIEW (APERÇU) ---
        function openPreview() {
            autoSave();
            const item = appData[currentMode].items.find(i => i.id === currentPageId);
            if(!item) return;

            const modal = document.getElementById('previewModal');
            const contentBox = document.getElementById('prvContent');
            const fontCSS = fontMapping[appConfig.fontFamily] || fontMapping['Newsreader'];
            
            contentBox.style.fontFamily = fontCSS;
            
            let html = ``;
            const titleHTML = `<div class="prv-title">${item.title}</div>`;
            const imgHTML = item.image ? `<img src="${item.image}" class="prv-img ${item.layout === 'bg' ? 'bg-mode' : ''}">` : '';
            const txtHTML = `<div class="prv-text">${item.text}</div>`;

            if(item.layout === 'bg') {
                html = imgHTML + titleHTML + txtHTML;
            } else if (item.layout === 'top') {
                html = imgHTML + titleHTML + txtHTML;
            } else if (item.layout === 'center') {
                html = titleHTML + imgHTML + txtHTML;
            } else if (item.layout === 'bottom') {
                html = titleHTML + txtHTML + imgHTML;
            }

            contentBox.innerHTML = html;
            modal.classList.add('active');
        }

        function closePreview() { document.getElementById('previewModal').classList.remove('active'); }
        
        function setPreviewSize(size, btn) {
            document.querySelectorAll('.preview-controls button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const screen = document.getElementById('previewScreen');
            screen.className = 'preview-screen ' + size;
        }

        // --- GESTION DES FICHIERS & SESSION ---
        function saveSession() {
            localStorage.setItem('writer_sources_v6', JSON.stringify({ data: appData, config: appConfig }));
            setSyncStatus('synced');
        }

        function manualSave() { autoSave(); saveSession(); }

        function loadSession() {
            const saved = localStorage.getItem('writer_sources_v6');
            if(saved) {
                try {
                    const parsed = JSON.parse(saved);
                    appData = parsed.data || appData;
                    appConfig = parsed.config || appConfig;
                    
                    if(appConfig.fontFamily) {
                        document.getElementById('fontSelector').value = appConfig.fontFamily;
                        applyFont(appConfig.fontFamily);
                    }
                    if(appConfig.theme) {
                        currentThemeIndex = themes.indexOf(appConfig.theme) !== -1 ? themes.indexOf(appConfig.theme) : 0;
                        document.body.setAttribute('data-theme', appConfig.theme);
                    }
                } catch(e) {}
            }
            setMode('book');
        }

        function exportWorkflow() {
            autoSave(); saveSession();
            const blob = new Blob([JSON.stringify({ data: appData, config: appConfig }, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a"); a.href = url; a.download = "projet.writerwork";
            a.click(); URL.revokeObjectURL(url);
        }

        function importWorkflow(event) {
            const file = event.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if(parsed.data && parsed.config) {
                        appData = parsed.data; appConfig = parsed.config;
                        saveSession(); loadSession();
                    }
                } catch(err) { alert("Fichier invalide."); }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function exportPagesData() {
            autoSave(); saveSession();
            const exportObj = {
                format: currentMode, 
                langue: currentLang,
                config: { 
                    fontFamily: appConfig.fontFamily, 
                    fontCSS: fontMapping[appConfig.fontFamily]
                },
                items: appData[currentMode].items
            };
            const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a"); a.href = url; a.download = "pages.data";
            a.click(); URL.revokeObjectURL(url);
        }

        function toggleLang() {
            currentLang = currentLang === 'fr' ? 'en' : 'fr';
            document.getElementById('langBtn').innerText = currentLang === 'fr' ? 'EN' : 'FR';
            
            document.querySelectorAll('[data-i18n]').forEach(el => { 
                if(i18n[currentLang][el.getAttribute('data-i18n')]) {
                    el.innerText = i18n[currentLang][el.getAttribute('data-i18n')]; 
                }
            });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => { 
                if(i18n[currentLang][el.getAttribute('data-i18n-ph')]) {
                    el.placeholder = i18n[currentLang][el.getAttribute('data-i18n-ph')]; 
                }
            });
            refreshSelector();
        }

        window.onload = loadSession;
    </script>
</body>
</html>
