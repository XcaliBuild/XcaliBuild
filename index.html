<style>

select{border-color:var(--border);background:rgba(0,0,0,.4)}select option{background:#111}

.meta-input{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:inherit;font-family:'Inter',sans-serif;font-size:13px;padding:10px 12px;border-radius:6px;outline:none;width:100%}
.meta-row{display:flex;gap:14px;flex-wrap:wrap}

textarea.main{width:100%;min-height:360px;background:transparent;border:none;color:inherit;font-family:inherit;font-size:17px;line-height:1.85;resize:vertical;outline:none}
input[type=range]{width:100%;accent-color:var(--accent)}

.upload{border:1px dashed var(--border);padding:12px;border-radius:8px;text-align:center;cursor:pointer}

<style id="customFontsStyle"></style>

<body>
<div class="ribbon glass">
<div class="ribbon-group">
<div class="logo-wrap"><div class="logo-icon">P</div><div class="logo-txt"><div class="logo-main">The Pages.</div><div class="logo-sub">sources</div></div></div>
<div class="divider"></div>
<button class="btn btn-outline" onclick="openProjects()"><i class="fas fa-folder"></i> <span data-i18n="projects">Mes Projets</span></button>
<select id="pageSelector" onchange="onPageChange()"></select>
<button class="btn btn-outline" onclick="addPage()"><i class="fas fa-plus"></i></button>
<button class="btn btn-outline btn-danger" onclick="deletePage()"><i class="fas fa-trash"></i></button>
</div>
<div class="ribbon-group">
<div class="sync" id="syncIndicator"><i class="fas fa-check-circle"></i> sync</div>
<div class="divider"></div>
<select id="fontSelector" onchange="changeFont()"></select>
<button class="btn btn-outline" onclick="openSettings()"><i class="fas fa-cog"></i></button>
<button class="btn btn-primary" onclick="manualSave()"><i class="fas fa-save"></i> <span data-i18n="save">Save</span></button>
<button class="btn btn-primary" style="background:#fff" onclick="exportPagesData()">pages.data</button>
</div>
</div>

<div class="main-body">
<div class="sidebar">
<div class="sidebar-scroll">
<div class="cat" data-i18n="reading">Lecture</div>
<div class="menu-item active" id="tab-book" onclick="setMode('book')"><i class="fas fa-book-open"></i> <span data-i18n="book">Livre (Poche)</span></div>
<div class="menu-item" id="tab-bd" onclick="setMode('bd')"><i class="fas fa-mask"></i> <span data-i18n="comic">Bande Dessinée</span></div>
<div class="menu-item" id="tab-enfant" onclick="setMode('enfant')"><i class="fas fa-child"></i> <span data-i18n="kids">Livre Enfant</span></div>
<div class="cat" data-i18n="editions">Éditions</div>
<div class="menu-item" id="tab-magazine" onclick="setMode('magazine')"><i class="fas fa-th-large"></i> <span data-i18n="magazine">Magazine</span></div>
<div class="menu-item" id="tab-journal" onclick="setMode('journal')"><i class="far fa-newspaper"></i> <span data-i18n="newspaper">Journal</span></div>
<div class="cat" data-i18n="currentProject">Projet Actuel</div>
<div style="padding:0 16px 10px;font-size:12px;color:var(--muted)" id="currentProjectName">-</div>
</div>
</div>

<div class="workspace">
<div class="sheet" id="sheet">
<div class="input-group">
<label data-i18n="workTitle">Titre de l'œuvre (Livre)</label>
<input id="globalTitle" class="text-input" data-i18n-ph="workTitlePh" placeholder="Ex: Mon Chef-d'œuvre" oninput="autoSave()">
</div>

<div class="meta-row" id="authorDateRow" style="display:none">
<div class="input-group"><label data-i18n="author">Auteur</label><input id="globalAuthor" class="meta-input" data-i18n-ph="authorPh" placeholder="Ex: Victor Hugo" oninput="autoSave()"></div>
<div class="input-group"><label data-i18n="date">Date</label><input id="globalDate" type="date" class="meta-input" oninput="autoSave()"></div>
</div>

<div class="meta-row">
<div class="input-group" style="flex:2"><label data-i18n="chapterTitle">Nom de la page</label><input id="itemTitle" class="meta-input" style="font-weight:700" data-i18n-ph="chapterPh" placeholder="Book Cover, Chapitre 1..." oninput="autoSave()"></div>
</div>

<div class="meta-row">
<div class="input-group" style="flex:2"><label data-i18n="image">Illustration (URL)</label><input id="itemImage" class="meta-input" placeholder="https://..." oninput="autoSave()"></div>
<div class="input-group" style="flex:1"><label data-i18n="layout">Disposition</label>
<div class="segment-group">
<button class="segment-btn active" id="lay-top" onclick="setLayout('top')"><i class="fas fa-arrow-up"></i> <span data-i18n="layoutTop">Haut</span></button>
<button class="segment-btn" id="lay-center" onclick="setLayout('center')"><i class="fas fa-align-center"></i> <span data-i18n="layoutCenter">Centre</span></button>
<button class="segment-btn" id="lay-bottom" onclick="setLayout('bottom')"><i class="fas fa-arrow-down"></i> <span data-i18n="layoutBottom">Bas</span></button>
<button class="segment-btn" id="lay-bg" onclick="setLayout('bg')"><i class="fas fa-image"></i></button>
</div></div>
</div>

<div class="meta-row">
<div class="input-group"><label><span data-i18n="imageSize">Taille image</span> <span id="imageSizeVal">70%</span></label><input type="range" id="imageSize" min="20" max="100" value="70" oninput="updateImageSize(this.value)"></div>
<div class="input-group" id="bgOpacityGroup" style="display:none"><label><span data-i18n="bgOpacity">Transparence du fond</span> <span id="bgOpacityVal">15%</span></label><input type="range" id="bgOpacity" min="5" max="100" value="15" oninput="updateBgOpacity(this.value)"></div>
</div>

<div class="input-group" style="flex:1">
<label><span data-i18n="body">Corps du texte</span> <span id="charCounterLabel"></span></label>
<textarea id="itemText" class="main" data-i18n-ph="bodyPh" placeholder="Commencez à écrire..." oninput="autoSave()"></textarea>
<div id="charCounter" class="char-counter">0 / 1500</div>
</div>

</div>
<button class="btn-preview" onclick="openPreview()"><i class="fas fa-eye"></i> <span data-i18n="preview">Aperçu</span></button>
</div>
</div>

<!-- PREVIEW -->
<div class="overlay" id="previewModal" onclick="if(event.target===this)closePreview()">
<div class="preview-shell" onclick="event.stopPropagation()">
<div class="preview-top">
<button class="btn btn-outline" id="btnMobile" onclick="setPreviewDevice('mobile')"><i class="fas fa-mobile-alt"></i> <span data-i18n="mobile">Mobile</span></button>
<button class="btn btn-outline" id="btnTablet" onclick="setPreviewDevice('tablet')"><i class="fas fa-tablet-alt"></i> <span data-i18n="tablet">Tablette</span></button>
<button class="btn btn-outline" id="btnLarge" onclick="setPreviewDevice('large')"><i class="fas fa-desktop"></i> <span data-i18n="large">Large</span></button>
<div class="divider"></div>
<button class="btn btn-primary" onclick="closePreview()"><i class="fas fa-times"></i> <span data-i18n="close">Fermer</span></button>
</div>
<div class="preview-screen mobile" id="previewScreen">
<button class="close-x" onclick="closePreview()"><i class="fas fa-times"></i></button>
<div class="prv-content" id="prvContent"></div>
</div>
</div>
</div>

<!-- PROJECTS -->
<div class="overlay" id="projectsModal">
<div class="modal"><div class="modal-head"><h3><i class="fas fa-folder-open"></i> <span data-i18n="projects">Mes Projets</span></h3><button class="btn" onclick="closeProjects()"><i class="fas fa-times"></i></button></div>
<div class="modal-body">
<div style="display:flex;gap:8px"><input id="newProjectTitle" class="meta-input" data-i18n-ph="newBookPlaceholder" placeholder="Titre du nouveau livre..." style="flex:1"><button class="btn btn-primary" onclick="createNewProject()"><i class="fas fa-plus"></i> <span data-i18n="newBook">Nouveau Livre</span></button></div>

</div></div>
</div>

<div class="overlay" id="settingsModal">
<div class="modal"><div class="modal-head"><h3><i class="fas fa-cog"></i> <span data-i18n="settings">Paramètres</span></h3><button class="btn" onclick="closeSettings()"><i class="fas fa-times"></i></button></div>
<div class="modal-body">
<div><label style="font-size:11px;text-transform:uppercase;opacity:.6" data-i18n="language">Langue</label>

<div><label style="font-size:11px;text-transform:uppercase;opacity:.6" data-i18n="fonts">Polices de livre</label>

</div>

<div><label style="font-size:11px;text-transform:uppercase;opacity:.6" data-i18n="backup">Sauvegarde</label>
<p style="font-size:12px;opacity:.6;margin-top:4px" data-i18n="backupDesc">Exporte / importe ton projet</p>
<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
<button class="btn btn-outline" onclick="exportWorkflow()"><i class="fas fa-download"></i> <span data-i18n="btnBackup">Backup complet</span></button>
<button class="btn btn-outline" onclick="document.getElementById('importWorkInput').click()"><i class="fas fa-upload"></i> <span data-i18n="btnImport">Importer</span></button>
<input type="file" id="importWorkInput" accept=".writerwork,.json" style="display:none" onchange="importWorkflow(event)">
</div></div>

<div style="border-top:1px solid var(--border);padding-top:14px;margin-top:6px">
<label style="font-size:11px;text-transform:uppercase;opacity:.6;color:#ef4444" data-i18n="danger">Zone Dangereuse</label>
<p style="font-size:11px;opacity:.5;margin:6px 0" data-i18n="resetDesc">Efface tous les projets, polices et réglages</p>
<button class="btn btn-outline btn-danger" style="width:100%;justify-content:center;border-color:rgba(239,68,68,.3)" onclick="factoryReset()"><i class="fas fa-trash-alt"></i> <span data-i18n="factoryReset">Factory Reset</span></button>
</div>

</div></div>
</div>

<div id="savedToast" class="saved-toast"><div class="saved-gif">✓</div><span data-i18n="saved">Enregistré!</span></div>

{id:'author',type:'author',title:'Page Auteur',image:'',layout:'top',imageSize:60,bgOpacity:15,author:'',date:'',text:'Description du livre, note de l\'auteur...'},
{id:'ch1',type:'chapter',title:'Chapitre 1',image:'',layout:'top',imageSize:70,bgOpacity:15,text:''}
]},bd:{title:"",items:[{id:'1',type:'chapter',title:'Planche 1',image:'',layout:'bg',imageSize:100,bgOpacity:20,text:''}]},magazine:{title:"",items:[{id:'1',type:'chapter',title:'Article 1',image:'',layout:'top',imageSize:70,bgOpacity:15,text:''}]},journal:{title:"",items:[{id:'1',type:'chapter',title:'News 1',image:'',layout:'top',imageSize:70,bgOpacity:15,text:''}]},enfant:{title:"",items:[{id:'1',type:'chapter',title:'Page 1',image:'',layout:'top',imageSize:80,bgOpacity:15,text:''}]}});
const uid=()=> 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
function applyI18n(){ const d=i18nDict[currentLang]||i18nDict.fr; document.querySelectorAll('[data-i18n]').forEach(el=>{ const k=el.getAttribute('data-i18n'); if(d[k]) el.textContent=d[k]; }); document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ const k=el.getAttribute('data-i18n-ph'); if(d[k]) el.placeholder=d[k]; }); }
function setLang(l){ currentLang=l; localStorage.setItem('writer_lang',l); applyI18n(); highlightLang(); refreshSelector(); updateCharCounter(); }
function highlightLang(){ document.getElementById('lang-fr')?.classList.toggle('btn-primary',currentLang==='fr'); document.getElementById('lang-en')?.classList.toggle('btn-primary',currentLang==='en'); }
function loadCustomFonts(){ try{ const saved=JSON.parse(localStorage.getItem('writer_custom_fonts')||'[]'); customFonts=saved; let css=''; saved.forEach(f=>{ css+=`@font-face{font-family:'${f.name}';src:url('${f.dataUrl}');}\n`; fontMapping[f.name]=`'${f.name}'`; }); document.getElementById('customFontsStyle').textContent=css; renderFonts(); refreshFontSelector(); }catch(e){} }
function refreshFontSelector(){ const sel=document.getElementById('fontSelector'); const cur=sel.value||appConfig.fontFamily; sel.innerHTML=''; Object.keys(fontMapping).forEach(n=>{ const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); }); sel.value=fontMapping[cur]?cur:Object.keys(fontMapping)[0]; }
function handleFontUpload(e){ const file=e.target.files[0]; if(!file) return; const r=new FileReader(); r.onload=ev=>{ const dataUrl=ev.target.result; const name=file.name.replace(/\.[^/.]+$/,"").replace(/[^a-zA-Z0-9 _-]/g,'').trim()||'Custom'; if(fontMapping[name]){ alert('Font exists'); return; } document.getElementById('customFontsStyle').textContent+=`@font-face{font-family:'${name}';src:url('${dataUrl}');}\n`; fontMapping[name]=`'${name}'`; customFonts.push({name,dataUrl}); localStorage.setItem('writer_custom_fonts',JSON.stringify(customFonts)); refreshFontSelector(); renderFonts(); document.getElementById('fontSelector').value=name; changeFont(); }; r.readAsDataURL(file); e.target.value=''; }
function renderFonts(){ const c=document.getElementById('fontsList'); if(!c) return; c.innerHTML=''; Object.keys(fontMapping).forEach(name=>{ const div=document.createElement('div'); div.className='project-item'; div.innerHTML=`<span style="font-family:${fontMapping[name]}">${name}</span><small style="opacity:.5">${customFonts.find(f=>f.name===name)?'custom':'book'}</small>`; c.appendChild(div); }); }
function loadProjects(){ try{ projects=JSON.parse(localStorage.getItem('writer_projects_v2')||'[]'); currentProjectId=localStorage.getItem('writer_current_project_id'); if(projects.length===0){ const p={id:uid(),title:'Mon premier livre',data:defaultDataTemplate(),config:{fontFamily:'Playfair Display',theme:'noir'},mode:'book',pageId:'cover',updatedAt:Date.now()}; projects=[p]; currentProjectId=p.id; saveProjects(); } if(!projects.find(p=>p.id===currentProjectId)) currentProjectId=projects[0].id; projects.forEach(proj=>{ if(proj.data.book && proj.data.book.items){ proj.data.book.items.forEach((it,i)=>{ if(!it.type){ if(i===0) it.type='cover'; else if(i===1) it.type='author'; else it.type='chapter'; } if(it.type==='author' && it.author===undefined){ it.author=''; it.date=''; } }); } }); }catch(e){} }
function saveProjects(){ localStorage.setItem('writer_projects_v2',JSON.stringify(projects)); localStorage.setItem('writer_current_project_id',currentProjectId); }
function getCurrentProject(){ return projects.find(p=>p.id===currentProjectId); }
function openProjects(){ renderProjectsList(); document.getElementById('projectsModal').classList.add('active'); }
function closeProjects(){ document.getElementById('projectsModal').classList.remove('active'); }
function renderProjectsList(){ const list=document.getElementById('projectsList'); list.innerHTML=''; projects.slice().sort((a,b)=>b.updatedAt-a.updatedAt).forEach(p=>{ const div=document.createElement('div'); div.className='project-item'+(p.id===currentProjectId?' active':''); div.innerHTML=`<div><b>${p.title}</b><br><small style="opacity:.6">${new Date(p.updatedAt).toLocaleString()} · ${p.data[p.mode]?.items?.length||0} pages</small></div><div style="display:flex;gap:6px"><button class="btn btn-outline" onclick="switchProject('${p.id}')"><i class="fas fa-external-link-alt"></i></button><button class="btn btn-outline" onclick="duplicateProject('${p.id}')"><i class="fas fa-copy"></i></button><button class="btn btn-outline btn-danger" onclick="deleteProject('${p.id}')"><i class="fas fa-trash"></i></button></div>`; list.appendChild(div); }); }
function createNewProject(){ const input=document.getElementById('newProjectTitle'); const title=input.value.trim()|| (currentLang==='en'?'New Book':'Nouveau Livre'); const p={id:uid(),title,data:defaultDataTemplate(),config:{fontFamily:appConfig.fontFamily,theme:'noir'},mode:'book',pageId:'cover',updatedAt:Date.now()}; projects.unshift(p); currentProjectId=p.id; saveProjects(); loadProjectIntoUI(); input.value=''; renderProjectsList(); }
function switchProject(id){ currentProjectId=id; saveProjects(); loadProjectIntoUI(); closeProjects(); }
function duplicateProject(id){ const src=projects.find(p=>p.id===id); if(!src) return; const copy=JSON.parse(JSON.stringify(src)); copy.id=uid(); copy.title=src.title+' (copy)'; copy.updatedAt=Date.now(); projects.unshift(copy); saveProjects(); renderProjectsList(); }
function deleteProject(id){ if(projects.length<=1){ alert('Need 1 project'); return; } if(!confirm(currentLang==='en'?'Delete this project?':'Supprimer ce projet?')) return; projects=projects.filter(p=>p.id!==id); if(currentProjectId===id) currentProjectId=projects[0].id; saveProjects(); loadProjectIntoUI(); renderProjectsList(); }
function loadProjectIntoUI(){ const proj=getCurrentProject(); if(!proj) return; appConfig=proj.config||{fontFamily:'Playfair Display'}; document.getElementById('currentProjectName').textContent=proj.title; document.getElementById('globalTitle').value=proj.data[currentMode]?.title||proj.title||''; document.getElementById('fontSelector').value=appConfig.fontFamily||'Playfair Display'; applyFont(appConfig.fontFamily); setMode(currentMode,false); refreshSelector(true); applyI18n(); highlightLang(); }
function setMode(mode,save=true){ currentMode=mode; document.querySelectorAll('.menu-item').forEach(el=>el.classList.remove('active')); document.getElementById('tab-'+mode)?.classList.add('active'); const proj=getCurrentProject(); if(proj){ document.getElementById('globalTitle').value=proj.data[mode]?.title||''; } refreshSelector(); if(save) autoSave(); }
function getDisplayName(it,idx){ const d=i18nDict[currentLang]; if(it.type==='cover') return `📖 ${d.bookCover}${it.title && it.title!==d.bookCover?' · '+it.title:''}`; if(it.type==='author') return `✍️ ${d.authorPage}${it.title && it.title!==d.authorPage?' · '+it.title:''}`; return it.title||`${d.page} ${idx+1}`; }
function refreshSelector(keep=false){ const proj=getCurrentProject(); if(!proj) return; const sel=document.getElementById('pageSelector'); sel.innerHTML=''; const items=proj.data[currentMode]?.items||[]; items.forEach((it,idx)=>{ const o=document.createElement('option'); o.value=it.id; o.text=getDisplayName(it,idx); sel.appendChild(o); }); if(!keep||!items.find(i=>i.id===currentPageId)) currentPageId=items[0]?.id||null; if(currentPageId) sel.value=currentPageId; loadPageData(); }
function onPageChange(){ currentPageId=document.getElementById('pageSelector').value; loadPageData(); }
function loadPageData(){
 const proj=getCurrentProject(); if(!proj) return; const item=proj.data[currentMode]?.items.find(i=>i.id===currentPageId); if(!item) return;
 document.getElementById('itemTitle').value=item.title||''; document.getElementById('itemImage').value=item.image||''; document.getElementById('itemText').value=item.text||'';
 document.getElementById('imageSize').value=item.imageSize||70; document.getElementById('imageSizeVal').textContent=(item.imageSize||70)+'%';
 document.getElementById('bgOpacity').value=item.bgOpacity||15; document.getElementById('bgOpacityVal').textContent=(item.bgOpacity||15)+'%';
 // author row only on author page
 const isAuthorPage = item.type==='author';
 document.getElementById('authorDateRow').style.display = isAuthorPage? 'flex' : 'none';
 if(isAuthorPage){ document.getElementById('globalAuthor').value=item.author||''; document.getElementById('globalDate').value=item.date||''; }
 // cover styling
 document.getElementById('sheet').classList.toggle('is-cover', item.type==='cover');
 setLayout(item.layout||'top',false); updateCharCounter();
}
function setLayout(l,save=true){ document.querySelectorAll('.segment-btn').forEach(b=>b.classList.remove('active')); document.getElementById('lay-'+l)?.classList.add('active'); document.getElementById('bgOpacityGroup').style.display=l==='bg'?'flex':'none'; if(save) autoSave(); }
function updateImageSize(v){ document.getElementById('imageSizeVal').textContent=v+'%'; autoSave(); }
function updateBgOpacity(v){ document.getElementById('bgOpacityVal').textContent=v+'%'; autoSave(); }
function updateCharCounter(){ const limit=LIMITS[currentMode]||1500; const len=document.getElementById('itemText').value.length; const c=document.getElementById('charCounter'); c.textContent=`${len} / ${limit}`; c.className='char-counter'+(len>limit?' over': len>limit*.8?' warn':''); const d=i18nDict[currentLang]; const key='limit'+(currentMode==='book'?'Book':currentMode==='bd'?'BD':currentMode==='enfant'?'Kid':'Mag'); document.getElementById('charCounterLabel').textContent='· '+(d[key]||limit); }
function showSavedGif(){ const t=document.getElementById('savedToast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); document.getElementById('syncIndicator').innerHTML='<i class="fas fa-check-circle" style="color:#22d3ee"></i> saved'; setTimeout(()=>{ document.getElementById('syncIndicator').innerHTML='<i class="fas fa-check-circle"></i> sync'; },2000); }
function autoSave(){
 const proj=getCurrentProject(); if(!proj) return;
 document.getElementById('syncIndicator').innerHTML='<i class="fas fa-sync-alt fa-spin"></i> saving';
 clearTimeout(saveTimeout);
 saveTimeout=setTimeout(()=>{
  proj.title=document.getElementById('globalTitle').value||proj.title;
  proj.data[currentMode].title=proj.title;
  const item=proj.data[currentMode].items.find(i=>i.id===currentPageId);
  if(item){
   let nt=document.getElementById('itemText').value; const limit=LIMITS[currentMode]||1500; if(nt.length>limit) nt=nt.slice(0,limit);
   document.getElementById('itemText').value=nt;
   item.title=document.getElementById('itemTitle').value.trim() || (item.type==='cover'?'Book Cover': item.type==='author'?'Page Auteur':'Sans titre');
   item.image=document.getElementById('itemImage').value; item.text=nt;
   item.layout=document.querySelector('.segment-btn.active')?.id.replace('lay-','')||'top';
   item.imageSize=parseInt(document.getElementById('imageSize').value)||70;
   item.bgOpacity=parseInt(document.getElementById('bgOpacity').value)||15;
   if(item.type==='author'){ item.author=document.getElementById('globalAuthor').value; item.date=document.getElementById('globalDate').value; }
   const opt=document.getElementById('pageSelector').querySelector(`option[value="${currentPageId}"]`); if(opt){ const idx=proj.data[currentMode].items.findIndex(i=>i.id===currentPageId); opt.text=getDisplayName(item,idx); }
  }
  proj.config=appConfig; proj.pageId=currentPageId; proj.mode=currentMode; proj.updatedAt=Date.now();
  saveProjects(); showSavedGif(); updateCharCounter(); document.getElementById('currentProjectName').textContent=proj.title;
 },380);
}
function addPage(){ const proj=getCurrentProject(); if(!proj) return; const count=proj.data[currentMode].items.filter(i=>i.type==='chapter').length+1; const nid='ch_'+Date.now(); proj.data[currentMode].items.push({id:nid,type:'chapter',title:`Chapitre ${count}`,image:'',layout:'top',imageSize:70,bgOpacity:15,text:''}); currentPageId=nid; saveProjects(); refreshSelector(true); autoSave(); }
function deletePage(){ const proj=getCurrentProject(); if(!proj) return; if(proj.data[currentMode].items.length<=1) return; const item=proj.data[currentMode].items.find(i=>i.id===currentPageId); if(item.type==='cover' || item.type==='author'){ alert(currentLang==='en'?'Cannot delete Cover/Author page':'On ne peut pas supprimer Cover/Auteur'); return; } if(!confirm(currentLang==='en'?'Delete this page?':'Supprimer cette page?')) return; proj.data[currentMode].items=proj.data[currentMode].items.filter(i=>i.id!==currentPageId); currentPageId=proj.data[currentMode].items[0].id; saveProjects(); refreshSelector(true); }
function changeFont(){ const n=document.getElementById('fontSelector').value; appConfig.fontFamily=n; applyFont(n); saveProjects(); }
function applyFont(n){ const css=fontMapping[n]||fontMapping['Playfair Display']; document.getElementById('itemText').style.fontFamily=css; document.getElementById('itemTitle').style.fontFamily=css; document.getElementById('globalTitle').style.fontFamily=css; }
function splitCenter(t){ if(!t||t.length<60) return [t,'']; const mid=Math.floor(t.length/2); let idx=t.indexOf('\n\n',mid-100); if(idx===-1) idx=t.lastIndexOf('. ',mid); if(idx===-1) idx=mid; return [t.slice(0,idx).trim(), t.slice(idx).trim()]; }
function openPreview(){ autoSave(); const proj=getCurrentProject(); if(!proj) return; const item=proj.data[currentMode].items.find(i=>i.id===currentPageId); if(!item) return; const box=document.getElementById('prvContent'); box.style.fontFamily=fontMapping[appConfig.fontFamily]||fontMapping['Playfair Display']; const size=item.imageSize||70; const opacity=(item.bgOpacity||15)/100; const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); let title=''; if(item.type==='cover'){ title=`<div class="prv-title" style="text-align:center;font-family:'Playfair Display';font-size:2.2em;margin-top:40px">${esc(proj.title||item.title)}</div>`; }else{ title=item.title?`<div class="prv-title">${esc(item.title)}</div>`:''; if(item.type==='author' && (item.author||item.date)){ title+=`<div style="font-size:.9em;opacity:.6;margin-bottom:10px">${esc(item.author||'')}${item.author&&item.date?' · ':''}${esc(item.date||'')}</div>`; } } const img=item.image?`<img src="${item.image}" class="prv-img ${item.layout==='bg'?'bg':''}" style="${item.layout!=='bg'?`width:${size}%`:`opacity:${opacity}`}" onerror="this.style.display='none'">`:''; let html=''; if(item.layout==='bg'){ html=img+`<div style="position:relative;z-index:1">${title}<div class="prv-text">${esc(item.text||'')}</div></div>`; }else if(item.layout==='center'){ const [a,b]=splitCenter(item.text||''); html=title+`<div style="display:flex;flex-direction:column;gap:16px"><div class="prv-text">${esc(a)}</div>${img}<div class="prv-text">${esc(b)}</div></div>`; }else if(item.layout==='top'){ html=img+title+`<div class="prv-text">${esc(item.text||'')}</div>`; }else{ html=title+`<div class="prv-text">${esc(item.text||'')}</div>`+img; } box.innerHTML=html; document.getElementById('previewModal').classList.add('active'); setPreviewDevice(previewDevice); }
function closePreview(){ document.getElementById('previewModal').classList.remove('active'); }
function setPreviewDevice(d){ previewDevice=d; const s=document.getElementById('previewScreen'); s.className='preview-screen '+d; document.getElementById('btnMobile')?.classList.toggle('btn-primary',d==='mobile'); document.getElementById('btnTablet')?.classList.toggle('btn-primary',d==='tablet'); document.getElementById('btnLarge')?.classList.toggle('btn-primary',d==='large'); }
function openSettings(){ document.getElementById('settingsModal').classList.add('active'); renderFonts(); highlightLang(); }
function closeSettings(){ document.getElementById('settingsModal').classList.remove('active'); }
function factoryReset(){ if(!confirm(currentLang==='en'?'Erase EVERYTHING? This cannot be undone.':'Tout effacer? Irréversible.')) return; localStorage.removeItem('writer_projects_v2'); localStorage.removeItem('writer_custom_fonts'); localStorage.removeItem('writer_current_project_id'); location.reload(); }
function exportWorkflow(){ const proj=getCurrentProject(); const blob=new Blob([JSON.stringify({project:proj},null,2)],{type:"application/json"}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=(proj.title||'projet')+'.writerwork'; a.click(); URL.revokeObjectURL(url); }
function importWorkflow(e){ const file=e.target.files[0]; if(!file) return; const r=new FileReader(); r.onload=ev=>{ try{ const p=JSON.parse(ev.target.result); const proj=p.project||p; if(proj.data){ proj.id=uid(); proj.updatedAt=Date.now(); projects.unshift(proj); currentProjectId=proj.id; saveProjects(); loadProjectIntoUI(); } }catch(err){ alert('Invalid file'); } }; r.readAsText(file); e.target.value=''; }
function exportPagesData(){ autoSave(); const proj=getCurrentProject(); if(!proj) return; const items=proj.data[currentMode].items.map(it=>({id:it.id,type:it.type,title:it.title,image:it.image,layout:it.layout,imageSize:it.imageSize,bgOpacity:it.bgOpacity,author:it.author||'',date:it.date||'',text:it.text,charCount:(it.text||'').length})); const obj={projectTitle:proj.title,format:currentMode,lang:currentLang,config:{fontFamily:appConfig.fontFamily,fontCSS:fontMapping[appConfig.fontFamily]},items}; const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='pages.data'; a.click(); URL.revokeObjectURL(url); }
function manualSave(){ autoSave(); }
window.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closePreview(); closeSettings(); closeProjects(); } });
window.onload=()=>{ loadCustomFonts(); loadProjects(); refreshFontSelector(); applyI18n(); loadProjectIntoUI(); };
</script>
