<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writer. · The Pages. Sources</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,600;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Roboto:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-app: #1e1e24; 
            --bg-ribbon: #2b2b36;
            --bg-sidebar: #25252f;
            --text-ui: #ffffff;
            --text-muted: #9ca3af;
            --border-color: #3f3f4e;
            --sheet-bg-clair: #ffffff; --sheet-text-clair: #111111;
            --sheet-bg-sombre: #121212; --sheet-text-sombre: #e0e0e0;
            --sheet-bg-papier: #f4ecd8; --sheet-text-papier: #433422;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-app); color: var(--text-ui); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .ribbon { width: 100%; height: 70px; background-color: var(--bg-ribbon); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; position: relative; }
        .ribbon-left { display: flex; align-items: center; gap: 30px; }
        .ribbon-right { display: flex; align-items: center; gap: 12px; }
        
        .logo-container { display: flex; flex-direction: column; line-height: 1.1; cursor: pointer; position: relative; }
        .logo-container:hover .logo-edit-hint { opacity: 1; }
        .logo-edit-hint { position: absolute; bottom: -15px; left: 0; font-size: 9px; color: cyan; opacity: 0; transition: 0.2s; white-space: nowrap; }
        .logo-text { font-family: 'Newsreader', serif; font-size: 26px; font-weight: 700; font-style: italic; color: #ffffff; letter-spacing: -0.5px; }
        .logo-sub { font-size: 10px; color: cyan; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
        
        .toolbar { display: flex; align-items: center; gap: 10px; border-left: 1px solid var(--border-color); padding-left: 20px; }
        .toolbar-divider { width: 1px; height: 30px; background-color: var(--border-color); margin: 0 5px; }
        
        select, .btn { background: var(--bg-app); color: var(--text-ui); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; outline: none; }
        .btn:hover { background: #3f3f4e; }
        .btn-icon { padding: 8px; border-radius: 6px; width: 34px; height: 34px; justify-content: center; }
        
        .btn-green { background: #10b981; color: white; border: none; }
        .btn-green:hover { background: #059669; }
        .btn-blue { color: #3b82f6; border-color: rgba(59, 130, 246, 0.4); }
        .btn-blue:hover { background: rgba(59, 130, 246, 0.1); border-color: #3b82f6; }
        .btn-danger { color: #ef4444; }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }
        
        .font-tool { display: flex; align-items: center; gap: 5px; background: var(--bg-app); padding: 2px 2px 2px 10px; border-radius: 6px; border: 1px solid var(--border-color); }
        .font-tool i { font-size: 16px; }
        .font-tool select { border: none; background: transparent; padding: 6px; color: white; outline: none; }

        /* Indicateur de synchronisation */
        .sync-indicator { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
        .sync-indicator i { font-size: 14px; }
        .sync-indicator.synced i { color: #10b981; }
        .sync-indicator.saving i { color: #f59e0b; animation: spin 1s linear infinite; }
        .sync-indicator.error i { color: #ef4444; }
        
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .main-body { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 220px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }
        .menu-category { font-size: 11px; text-transform: uppercase; color: var(--text-muted); padding: 15px 20px 5px 20px; letter-spacing: 1px; font-weight: 700; }
        .menu-item { padding: 10px 20px; display: flex; align-items: center; gap: 12px; color: var(--text-muted); cursor: pointer; transition: 0.2s; font-size: 13px; font-weight: 500; border-left: 3px solid transparent; }
        .menu-item:hover { color: var(--text-ui); background: rgba(255,255,255,0.03); }
        .menu-item.active { color: cyan; background: rgba(0, 255, 255, 0.05); border-left: 3px solid cyan; }
        .menu-item i { width: 16px; text-align: center; }

        .editor-workspace { flex: 1; background-color: #17171c; padding: 40px 20px; overflow-y: auto; display: flex; justify-content: center; align-items: flex-start; }
        
        .writing-sheet { width: 100%; max-width: 780px; background: var(--sheet-bg-clair); color: var(--sheet-text-clair); border-radius: 4px; padding: 50px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 24px; transition: background 0.3s, color 0.3s; }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; position: relative;}
        .input-group label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; font-weight: 700; font-family: 'Inter', sans-serif; }
        
        input.text-input { background: transparent; border: none; border-bottom: 1px solid rgba(128,128,128,0.2); color: inherit; font-size: 26px; font-weight: 700; font-family: inherit; padding: 5px 0; outline: none; }
        input.meta-input { background: rgba(128,128,128,0.08); border: 1px solid rgba(128,128,128,0.2); color: inherit; font-family: 'Inter', sans-serif; font-size: 13px; padding: 12px; border-radius: 6px; outline: none; width: 100%; }
        
        textarea.main-textarea { width: 100%; flex: 1; min-height: 500px; background: transparent; border: none; color: inherit; font-family: inherit; font-size: 17px; line-height: 1.7; resize: none; outline: none; }
        
        .meta-row { display: flex; gap: 20px; }
        .meta-row .input-group { flex: 1; }

        .toolbar-text { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: -15px; z-index: 10;}
        .link-btn { background: rgba(128,128,128,0.1); border: 1px solid rgba(128,128,128,0.2); color: inherit; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: 0.2s; font-family: 'Inter', sans-serif; font-weight: 600;}
        .link-btn:hover { background: rgba(0, 255, 255, 0.2); color: cyan; border-color: cyan;}
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: var(--bg-ribbon); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; width: 90%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
        .modal-box h3 { font-family: 'Newsreader', serif; font-size: 20px; }
        .modal-box input { background: var(--bg-app); border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 6px; font-family: 'Inter', sans-serif; }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; }
    </style>
</head>
<body>

    <!-- MODAL LOGO -->
    <div class="modal-overlay" id="logoModal">
        <div class="modal-box">
            <h3>Personnaliser le logo de Pages</h3>
            <p style="font-size:13px; color: var(--text-muted);">Entrez l'URL de votre logo (image). Il sera affiché dans l'application Pages.</p>
            <input type="text" id="logoUrlInput" placeholder="https://monsite.com/logo.png">
            <div style="display:flex; gap:10px; align-items:center;">
                <input type="text" id="logoAltInput" placeholder="Texte alternatif (optionnel)" style="flex:1;">
            </div>
            <div class="modal-buttons">
                <button class="btn" onclick="closeLogoModal()">Annuler</button>
                <button class="btn btn-green" onclick="saveLogo()">Appliquer</button>
            </div>
        </div>
    </div>

    <!-- RUBAN DU HAUT -->
    <div class="ribbon">
        <div class="ribbon-left">
            <div class="logo-container" onclick="openLogoModal()">
                <div class="logo-text" id="displayLogo">Writer.</div>
                <div class="logo-sub">The Pages. Sources</div>
                <div class="logo-edit-hint">Cliquer pour changer le logo</div>
            </div>
            
            <div class="toolbar">
                <select id="pageSelector" onchange="loadPageData()"></select>
                <button class="btn" onclick="addPage()"><i class="fas fa-plus"></i> <span data-i18n="newBtn">page</span></button>
                <button class="btn btn-icon btn-danger" onclick="deletePage()" title="Supprimer la page"><i class="fas fa-trash"></i></button>
                
                <div class="toolbar-divider"></div>
                
                <div class="font-tool" title="Police du texte">
                    <i class="fas fa-font"></i>
                    <select id="fontSelector" onchange="changeFont()">
                        <option value="Newsreader">Newsreader</option>
                        <option value="Inter">Inter</option>
                        <option value="Courier Prime">Courier</option>
                        <option value="Lora">Lora</option>
                        <option value="Merriweather">Merriweather</option>
                        <option value="Roboto">Roboto</option>
                    </select>
                </div>
                
                <button class="btn btn-icon" onclick="cycleTheme()" title="Couleur de la page"><i class="fa-solid fa-circle-half-stroke"></i></button>
                
                <div class="toolbar-divider"></div>
                
                <button class="btn" onclick="toggleLang()" id="langBtn">EN</button>
            </div>
        </div>
        
        <div class="ribbon-right">
            <!-- INDICATEUR DE SYNCHRONISATION -->
            <div class="sync-indicator synced" id="syncIndicator">
                <i class="fas fa-sync-alt"></i>
                <span id="syncText">Synchronisé</span>
            </div>
            
            <div class="toolbar-divider" style="height:30px;"></div>

            <!-- OUTILS WORKFLOW -->
            <input type="file" id="importWorkInput" accept=".writerwork,.json" style="display:none" onchange="importWorkflow(event)">
            <button class="btn" onclick="document.getElementById('importWorkInput').click()" title="Importer Workflow"><i class="fas fa-folder-open"></i> <span data-i18n="btnImportWork">Import Work</span></button>
            <button class="btn" onclick="exportWorkflow()" title="Sauvegarder l'intégralité du travail localement"><i class="fas fa-archive"></i> <span data-i18n="btnExportWork">Backup Workflow</span></button>
            
            <button class="btn btn-blue" onclick="manualSave()"><i class="fas fa-save"></i> <span data-i18n="btnSave">Sauvegarder</span></button>
            
            <div class="toolbar-divider" style="height:30px;"></div>

            <button class="btn btn-green" onclick="exportPagesData()"><i class="fas fa-download"></i> pages.data</button>
        </div>
    </div>

    <!-- CORPS DE L'APPLICATION -->
    <div class="main-body">
        <div class="sidebar">
            <div class="menu-category" data-i18n="catReading">Lecture</div>
            <div class="menu-item active" id="tab-book" onclick="setMode('book')"><i class="fas fa-book"></i> <span data-i18n="menuBook">Livre (Poche)</span></div>
            <div class="menu-item" id="tab-bd" onclick="setMode('bd')"><i class="fas fa-mask"></i> <span data-i18n="menuBd">Bande Dessinée</span></div>
            <div class="menu-item" id="tab-enfant" onclick="setMode('enfant')"><i class="fas fa-child"></i> <span data-i18n="menuKid">Livre Enfant</span></div>
            
            <div class="menu-category" data-i18n="catEdition">Éditions</div>
            <div class="menu-item" id="tab-magazine" onclick="setMode('magazine')"><i class="fas fa-th-large"></i> <span data-i18n="menuMag">Magazine</span></div>
            <div class="menu-item" id="tab-journal" onclick="setMode('journal')"><i class="far fa-newspaper"></i> <span data-i18n="menuNews">Journal</span></div>
            <div class="menu-item" id="tab-recette" onclick="setMode('recette')"><i class="fas fa-utensils"></i> <span data-i18n="menuRecipe">Recettes</span></div>
            
            <div class="menu-category" data-i18n="catSocial">Réseaux</div>
            <div class="menu-item" id="tab-post" onclick="setMode('post')"><i class="fas fa-layer-group"></i> <span data-i18n="menuPost">Fil d'Actualités</span></div>
        </div>

        <div class="editor-workspace">
            <div class="writing-sheet" id="writingSheet">
                
                <div class="input-group" style="padding-bottom: 25px; border-bottom: 1px dashed rgba(128,128,128,0.3);">
                    <label id="globalTitleLabel" data-i18n="lblAppTitle">Nom du Livre / Projet (Global)</label>
                    <input type="text" id="globalTitle" class="text-input" placeholder="Ex: Mon Livre Magique" oninput="autoSave()">
                </div>

                <div class="meta-row">
                    <div class="input-group">
                        <label id="labelTitle" data-i18n="lblPageTitle">Nom de la page (S'affiche dans l'application)</label>
                        <input type="text" id="itemTitle" class="meta-input" placeholder="Chapitre 1, Couverture, Sommaire..." oninput="autoSave()">
                    </div>
                    <div class="input-group" id="grpCategory" style="display:none;">
                        <label data-i18n="lblCategory">Catégorie</label>
                        <input type="text" id="itemCategory" class="meta-input" placeholder="Ex: News..." oninput="autoSave()">
                    </div>
                </div>

                <div class="input-group" id="grpImage">
                    <label id="labelImage" data-i18n="lblImage">URL de l'image (Pour la couverture ou l'illustration)</label>
                    <input type="text" id="itemImage" class="meta-input" placeholder="https://..." oninput="autoSave()">
                </div>

                <div class="input-group" style="flex:1;">
                    <div class="toolbar-text">
                        <button class="link-btn" onclick="insertInternalLink()" title="Créer un lien vers une autre page"><i class="fas fa-link"></i> Insérer un lien interne</button>
                    </div>
                    <label id="labelText" data-i18n="lblText">Contenu</label>
                    <textarea id="itemText" class="main-textarea" placeholder="Commencez à écrire..." oninput="autoSave()"></textarea>
                </div>
                
            </div>
        </div>
    </div>

    <script>
        // --- DICTIONNAIRE DE LANGUES ---
        const i18n = {
            fr: {
                langBtn: "EN", newBtn: "page",
                catReading: "Lecture", catEdition: "Éditions", catSocial: "Réseaux",
                menuBook: "Livre (Poche)", menuBd: "Bande Dessinée", menuKid: "Livre Enfant",
                menuMag: "Magazine", menuNews: "Journal", menuRecipe: "Recettes", menuPost: "Fil d'Actualités",
                lblAppTitle: "Nom du Livre / Projet (Global)",
                lblPageTitle: "Nom de la page (S'affiche dans l'application)",
                lblCategory: "Catégorie",
                lblImage: "URL de l'image (Pour la couverture ou l'illustration)", lblImageReq: "URL DE LA PLANCHE (Obligatoire)",
                lblText: "Contenu", lblTextOpt: "Texte (Optionnel pour BD)",
                btnSave: "Sauvegarder", btnExportWork: "Backup Workflow", btnImportWork: "Import Work"
            },
            en: {
                langBtn: "FR", newBtn: "page",
                catReading: "Reading", catEdition: "Publishing", catSocial: "Social",
                menuBook: "Pocket Book", menuBd: "Comic Book", menuKid: "Children's Book",
                menuMag: "Magazine", menuNews: "Newspaper", menuRecipe: "Recipes", menuPost: "News Feed",
                lblAppTitle: "Book / Project Name (Global)",
                lblPageTitle: "Page Name (Displayed in app)",
                lblCategory: "Category",
                lblImage: "Image URL (For cover or illustration)", lblImageReq: "COMIC PAGE URL (Required)",
                lblText: "Content", lblTextOpt: "Text (Optional for Comics)",
                btnSave: "SAVE", btnExportWork: "Backup Workflow", btnImportWork: "Import Work"
            }
        };

        let currentLang = 'fr';
        
        // --- MAPPING DES POLICES (valeur → CSS font-family) ---
        const fontMapping = {
            'Newsreader': "'Newsreader', serif",
            'Inter': "'Inter', sans-serif",
            'Courier Prime': "'Courier Prime', monospace",
            'Lora': "'Lora', serif",
            'Merriweather': "'Merriweather', serif",
            'Roboto': "'Roboto', sans-serif"
        };
        
        // --- CONFIGURATION GLOBALE ---
        let appConfig = {
            logoUrl: '',
            logoAlt: 'Writer.',
            fontFamily: 'Newsreader',
            theme: 'clair'
        };

        let defaultData = {
            book: { 
                title: "", 
                items: [
                    { id: 'cover', title: 'Book Cover', image: '', text: '' },
                    { id: 'summary', title: 'Summary', image: '', text: '' },
                    { id: 'page_1', title: 'Page 1', image: '', text: '' },
                    { id: 'ending', title: 'Book Ending', image: '', text: '' }
                ] 
            },
            bd: { title: "", items: [{ id: 'page_1', title: 'Planche 1', image: '', text: '' }] },
            magazine: { title: "", items: [{ id: 'page_1', title: 'Article 1', category: '', image: '', text: '' }] },
            journal: { title: "", items: [{ id: 'page_1', title: 'Article 1', category: '', image: '', text: '' }] },
            enfant: { title: "", items: [{ id: 'page_1', title: 'Page 1', image: '', text: '' }] },
            recette: { title: "", items: [{ id: 'page_1', title: 'Recette 1', category: '', image: '', text: '' }] },
            post: { title: "", items: [{ id: 'page_1', title: 'Post 1', category: '', image: '', text: '' }] }
        };

        let appData = JSON.parse(JSON.stringify(defaultData));
        let currentMode = 'book';
        let currentPageId = 'cover';
        let saveTimeout = null;
        
        // --- SYNCHRONISATION ET SAUVEGARDE MANUELLE ---
        function setSyncStatus(status) {
            const indicator = document.getElementById('syncIndicator');
            const text = document.getElementById('syncText');
            
            indicator.className = 'sync-indicator ' + status;
            
            switch(status) {
                case 'synced':
                    text.textContent = 'Synchronisé';
                    break;
                case 'saving':
                    text.textContent = 'Sauvegarde...';
                    break;
                case 'error':
                    text.textContent = 'Erreur sync';
                    break;
            }
        }

        function manualSave() {
            autoSave();
            saveSession();
            alert(currentLang === 'fr' ? "Votre travail a été sauvegardé avec succès dans le navigateur !" : "Your work has been successfully saved in the browser!");
        }
        
        // --- EXPORT & IMPORT WORKFLOW (.writerwork) ---
        function exportWorkflow() {
            autoSave();
            saveSession();
            
            const workflowData = {
                data: appData,
                config: appConfig
            };
            
            const jsonString = JSON.stringify(workflowData, null, 2);
            const blob = new Blob([jsonString], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement("a");
            a.href = url;
            a.download = "mon_projet.writerwork";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importWorkflow(event) {
            const file = event.target.files[0];
            if(!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if(parsed.data && parsed.config) {
                        appData = parsed.data;
                        appConfig = parsed.config;
                        saveSession();
                        
                        // Ré-appliquer la configuration visuelle
                        if(appConfig.logoUrl) {
                            document.getElementById('displayLogo').innerHTML = `<img src="${appConfig.logoUrl}" alt="${appConfig.logoAlt}" style="height:30px; vertical-align:middle;">`;
                        } else {
                            document.getElementById('displayLogo').textContent = 'Writer.';
                        }
                        if(appConfig.fontFamily && fontMapping[appConfig.fontFamily]) {
                            document.getElementById('fontSelector').value = appConfig.fontFamily;
                            applyFont(appConfig.fontFamily);
                        }
                        if(appConfig.theme) {
                            applyTheme(appConfig.theme);
                        }
                        
                        setMode(currentMode); // Rafraîchit l'interface
                        alert(currentLang === 'fr' ? "Workflow importé avec succès !" : "Workflow imported successfully!");
                    } else {
                        throw new Error("Format invalide");
                    }
                } catch(error) {
                    alert(currentLang === 'fr' ? "Erreur : le fichier est invalide ou corrompu." : "Error: The file is invalid or corrupted.");
                }
                event.target.value = ''; // Réinitialiser l'input
            };
            reader.readAsText(file);
        }
        
        // --- GESTION DE SESSION ---
        function loadSession() {
            const savedData = localStorage.getItem('writer_session_v4');
            if(savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    appData = parsed.data || appData;
                    appConfig = parsed.config || appConfig;
                    
                    if(appConfig.logoUrl) {
                        document.getElementById('displayLogo').innerHTML = `<img src="${appConfig.logoUrl}" alt="${appConfig.logoAlt}" style="height:30px; vertical-align:middle;">`;
                    }
                    if(appConfig.fontFamily && fontMapping[appConfig.fontFamily]) {
                        document.getElementById('fontSelector').value = appConfig.fontFamily;
                        applyFont(appConfig.fontFamily);
                    }
                    if(appConfig.theme) {
                        const themes = ['clair', 'papier', 'sombre'];
                        let idx = themes.indexOf(appConfig.theme);
                        if(idx === -1) idx = 0;
                        currentThemeIndex = idx;
                        applyTheme(appConfig.theme);
                    }
                    setSyncStatus('synced');
                } catch(e) {
                    console.error('Erreur chargement session:', e);
                    setSyncStatus('error');
                }
            }
            setMode('book');
        }

        function saveSession() {
            try {
                localStorage.setItem('writer_session_v4', JSON.stringify({
                    data: appData,
                    config: appConfig
                }));
                setSyncStatus('synced');
            } catch(e) {
                console.error('Erreur sauvegarde session:', e);
                setSyncStatus('error');
            }
        }
        
        // --- GESTION DU LOGO ---
        function openLogoModal() {
            document.getElementById('logoModal').classList.add('active');
            document.getElementById('logoUrlInput').value = appConfig.logoUrl;
            document.getElementById('logoAltInput').value = appConfig.logoAlt;
        }
        
        function closeLogoModal() {
            document.getElementById('logoModal').classList.remove('active');
        }
        
        function saveLogo() {
            const url = document.getElementById('logoUrlInput').value.trim();
            const alt = document.getElementById('logoAltInput').value.trim() || 'Writer.';
            
            appConfig.logoUrl = url;
            appConfig.logoAlt = alt;
            
            if(url) {
                document.getElementById('displayLogo').innerHTML = `<img src="${url}" alt="${alt}" style="height:30px; vertical-align:middle;">`;
            } else {
                document.getElementById('displayLogo').textContent = 'Writer.';
            }
            
            closeLogoModal();
            saveSession();
        }
        
        // --- THÈME ET POLICES ---
        let themes = ['clair', 'papier', 'sombre'];
        let currentThemeIndex = 0;

        function applyTheme(theme) {
            const sheet = document.getElementById('writingSheet');
            if(theme === 'clair') { 
                sheet.style.background = 'var(--sheet-bg-clair)'; 
                sheet.style.color = 'var(--sheet-text-clair)'; 
            }
            else if (theme === 'papier') { 
                sheet.style.background = 'var(--sheet-bg-papier)'; 
                sheet.style.color = 'var(--sheet-text-papier)'; 
            }
            else { 
                sheet.style.background = 'var(--sheet-bg-sombre)'; 
                sheet.style.color = 'var(--sheet-text-sombre)'; 
            }
        }

        function cycleTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            const theme = themes[currentThemeIndex];
            appConfig.theme = theme;
            applyTheme(theme);
            saveSession();
        }

        function applyFont(fontName) {
            const cssFont = fontMapping[fontName];
            if(cssFont) {
                document.getElementById('itemText').style.fontFamily = cssFont;
                document.getElementById('itemTitle').style.fontFamily = cssFont;
                document.getElementById('globalTitle').style.fontFamily = cssFont;
            }
        }

        function changeFont() {
            const fontName = document.getElementById('fontSelector').value;
            appConfig.fontFamily = fontName;
            applyFont(fontName);
            saveSession();
        }

        // --- TRADUCTION ---
        function toggleLang() {
            currentLang = currentLang === 'fr' ? 'en' : 'fr';
            document.getElementById('langBtn').innerText = i18n[currentLang].langBtn;
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang][key]) el.innerText = i18n[currentLang][key];
            });
            updateLabelsForMode();
            refreshSelector();
        }

        // --- GESTION DES MODES ---
        function setMode(mode) {
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + mode).classList.add('active');
            currentMode = mode;
            
            document.getElementById('globalTitle').value = appData[mode].title || '';
            
            const grpCat = document.getElementById('grpCategory');
            if(['magazine', 'journal', 'recette', 'post'].includes(mode)) {
                grpCat.style.display = 'flex';
            } else {
                grpCat.style.display = 'none';
            }

            updateLabelsForMode();
            refreshSelector();
        }

        function updateLabelsForMode() {
            if(currentMode === 'bd') {
                document.getElementById('itemText').style.minHeight = '150px';
                document.getElementById('labelText').innerText = i18n[currentLang].lblTextOpt;
                document.getElementById('labelImage').innerText = i18n[currentLang].lblImageReq;
                document.getElementById('itemImage').style.border = "1px solid cyan";
            } else {
                document.getElementById('itemText').style.minHeight = '500px';
                document.getElementById('labelText').innerText = i18n[currentLang].lblText;
                document.getElementById('labelImage').innerText = i18n[currentLang].lblImage;
                document.getElementById('itemImage').style.border = "1px solid rgba(128,128,128,0.2)";
            }
        }

        function refreshSelector() {
            const selector = document.getElementById('pageSelector');
            selector.innerHTML = '';
            const items = appData[currentMode].items;
            
            items.forEach((item, index) => {
                const opt = document.createElement('option');
                opt.value = item.id;
                opt.text = item.title || `Page ${index + 1}`;
                selector.appendChild(opt);
            });
            
            if(!items.find(i => i.id === currentPageId) && items.length > 0) {
                currentPageId = items[0].id;
            } else if (items.length === 0) {
                currentPageId = null;
            }
            
            if(currentPageId) { 
                selector.value = currentPageId; 
                loadPageData(); 
            } else {
                document.getElementById('itemTitle').value = '';
                document.getElementById('itemImage').value = '';
                document.getElementById('itemText').value = '';
            }
        }

        function loadPageData() {
            currentPageId = document.getElementById('pageSelector').value;
            const item = appData[currentMode].items.find(i => i.id === currentPageId);
            if(item) {
                document.getElementById('itemTitle').value = item.title || '';
                document.getElementById('itemImage').value = item.image || '';
                document.getElementById('itemText').value = item.text || '';
                if(document.getElementById('itemCategory')) document.getElementById('itemCategory').value = item.category || '';
            }
        }

        function autoSave() {
            if(!currentPageId) return;
            
            // Afficher "Sauvegarde..." avec debounce
            setSyncStatus('saving');
            
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                appData[currentMode].title = document.getElementById('globalTitle').value;
                
                let item = appData[currentMode].items.find(i => i.id === currentPageId);
                if(item) {
                    item.title = document.getElementById('itemTitle').value;
                    item.image = document.getElementById('itemImage').value;
                    item.text = document.getElementById('itemText').value;
                    if(document.getElementById('itemCategory')) item.category = document.getElementById('itemCategory').value;
                    
                    const opt = document.getElementById('pageSelector').querySelector(`option[value="${currentPageId}"]`);
                    if(opt) opt.text = item.title || `Page`;
                }
                saveSession();
            }, 800);
        }

        function addPage() {
            const uniqueId = 'page_' + Date.now();
            const num = appData[currentMode].items.length + 1;
            
            let newPage = { id: uniqueId, title: `Page ${num}`, image: '', text: '', category: '' };
            
            if(currentMode === 'book') {
                const endingIndex = appData[currentMode].items.findIndex(i => i.id === 'ending' || i.title.toLowerCase().includes('ending'));
                if (endingIndex !== -1) {
                    appData[currentMode].items.splice(endingIndex, 0, newPage);
                } else {
                    appData[currentMode].items.push(newPage);
                }
            } else {
                appData[currentMode].items.push(newPage);
            }
            
            saveSession();
            refreshSelector();
            document.getElementById('pageSelector').value = uniqueId;
            loadPageData();
        }

        function deletePage() {
            if(appData[currentMode].items.length <= 1) return alert("Action impossible. Gardez au moins une page.");
            if(confirm("Confirmer la suppression de cette page ?")) {
                appData[currentMode].items = appData[currentMode].items.filter(i => i.id !== currentPageId);
                saveSession();
                refreshSelector();
            }
        }

        // --- OUTIL DE LIEN INTERNE ---
        function insertInternalLink() {
            if(!currentPageId) return;
            let options = appData[currentMode].items.map((i, index) => `${index + 1} - ${i.title}`).join('\n');
            
            let targetIndexStr = prompt(`Sélectionnez le NUMÉRO de la page cible :\n\n${options}`);
            if(targetIndexStr) {
                let targetIndex = parseInt(targetIndexStr) - 1;
                if (targetIndex >= 0 && targetIndex < appData[currentMode].items.length) {
                    let text = prompt("Texte du lien (ex: Lire le chapitre) :");
                    if (text) {
                        let linkHTML = `<a href="#" onclick="navigateToPage(${targetIndex}); return false;" style="color:var(--accent); text-decoration:underline;">${text}</a>`;
                        let textarea = document.getElementById('itemText');
                        textarea.setRangeText(linkHTML, textarea.selectionStart, textarea.selectionEnd, 'end');
                        autoSave();
                    }
                } else {
                    alert("Numéro de page invalide.");
                }
            }
        }

        // --- EXPORT pages.data ---
        function exportPagesData() {
            autoSave();
            saveSession();
            
            const formatData = appData[currentMode];
            
            const exportObject = {
                format: currentMode,
                titre: formatData.title || (currentLang === 'fr' ? 'Projet sans titre' : 'Untitled Project'),
                langue: currentLang,
                config: {
                    logo: appConfig.logoUrl,
                    logoAlt: appConfig.logoAlt,
                    fontFamily: appConfig.fontFamily,
                    fontCSS: fontMapping[appConfig.fontFamily] || fontMapping['Newsreader'],
                    theme: appConfig.theme
                },
                items: formatData.items
            };

            const jsonString = JSON.stringify(exportObject, null, 2);
            const blob = new Blob([jsonString], { type: "application/octet-stream" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement("a");
            a.href = url;
            a.download = "pages.data";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            setSyncStatus('synced');
        }

        // Démarrage
        window.onload = loadSession;
    </script>
</body>
</html>
