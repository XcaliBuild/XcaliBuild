<!DOCTYPE html>
<html lang="fr" data-theme="nuit">
<head>
    <meta charset="UTF-8">
    <title>The Pages. Sources | Pro Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Newsreader:ital,wght@0,400;0,600;1,400&family=Garamond&family=Lora&family=Merriweather&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #050505;
            --glass-bg: rgba(25, 25, 30, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #06b6d4;
            --text-main: #e5e7eb;
            --text-muted: #6b7280;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }

        /* HEADER */
        header { height: 60px; background: var(--glass-bg); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; }
        .logo-branding { color: var(--accent); font-family: 'Newsreader', serif; font-size: 18px; font-weight: 700; }
        
        /* SIDEBAR */
        .app-container { display: flex; flex: 1; overflow: hidden; }
        nav { width: 200px; background: rgba(10,10,15,0.5); border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; padding: 20px 0; }
        .nav-item { padding: 12px 20px; cursor: pointer; color: var(--text-muted); font-size: 13px; font-weight: 500; transition: 0.2s; }
        .nav-item:hover { color: var(--text-main); background: rgba(255,255,255,0.03); }
        .nav-item.active { color: var(--accent); border-left: 2px solid var(--accent); }

        /* WORKSPACE */
        .workspace { flex: 1; overflow-y: auto; padding: 40px; display: flex; justify-content: center; }
        .editor-sheet { width: 100%; max-width: 700px; background: #fff; color: #111; padding: 60px; border-radius: 4px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); min-height: 900px; }
        
        /* THEMES */
        [data-theme="noir"] .editor-sheet { background: #000; color: #fff; }
        [data-theme="bleu"] .editor-sheet { background: #002b36; color: #839496; }
        [data-theme="vieux-papier"] .editor-sheet { background: #f4ecd8; color: #3e2723; }
        [data-theme="clair-papier"] .editor-sheet { background: #fafafa; color: #222; }

        textarea { width: 100%; border: none; outline: none; font-size: 16px; line-height: 1.8; resize: none; background: transparent; }
        
        .floating-preview { position: fixed; bottom: 30px; right: 30px; background: var(--accent); color: white; padding: 12px 20px; border-radius: 20px; cursor: pointer; font-weight: 600; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <header class="glass">
        <div class="logo-branding">The Pages. Sources</div>
        <div style="display: flex; gap: 10px;">
            <button class="btn" onclick="createNewProject()">+ Nouveau Livre</button>
            <button class="btn" onclick="exportData()">Exporter .data</button>
        </div>
    </header>

    <div class="app-container">
        <nav>
            <div class="menu-category">PROJETS</div>
            <div id="projectList"></div>
            <div class="menu-category">PARAMÈTRES</div>
            <div class="nav-item" onclick="showSection('settings')">Configuration</div>
        </nav>

        <main class="workspace" id="editorSection">
            <div class="editor-sheet" id="editorSheet">
                <input type="text" id="pageTitle" placeholder="Titre de la page" style="width:100%; border:none; font-size: 24px; font-weight:bold; margin-bottom:20px; background:transparent;">
                <input type="text" id="imgUrl" placeholder="URL Image" style="width:100%; margin-bottom:10px;">
                <div id="imgLayout" style="margin-bottom:20px;">
                    <button onclick="setLayout('top')">Haut</button>
                    <button onclick="setLayout('center')">Centre</button>
                    <button onclick="setLayout('bottom')">Bas</button>
                </div>
                <textarea id="pageContent" class="main-textarea" placeholder="Commencez à écrire..."></textarea>
            </div>
        </main>
        
        <!-- Section Paramètres -->
        <main class="workspace" id="settingsSection" style="display:none;">
            <div class="editor-sheet">
                <h2>Paramètres</h2>
                <label>Upload Font (.ttf/.otf)</label>
                <input type="file" id="fontUpload" accept=".ttf,.otf" onchange="loadCustomFont(event)">
                <label>Langue</label>
                <select onchange="changeLang(this.value)">
                    <option value="fr">Français</option>
                    <option value="en">English</option>
                </select>
                <label>Thème</label>
                <select onchange="changeTheme(this.value)">
                    <option value="noir">Noir</option>
                    <option value="bleu">Écran Bleu</option>
                    <option value="vieux-papier">Vieux Papier</option>
                    <option value="clair-papier">Clair Papier</option>
                </select>
            </div>
        </main>
    </div>

    <script>
        // Data structure simple
        let projects = JSON.parse(localStorage.getItem('my_books')) || [{id: 1, title: 'Mon Premier Livre', pages: [{title:'Couverture', content:'', img:'', layout:'top'}]}];
        let currentProjectIndex = 0;
        let currentPageIndex = 0;

        function showSection(id) {
            document.getElementById('editorSection').style.display = id === 'editor' ? 'flex' : 'none';
            document.getElementById('settingsSection').style.display = id === 'settings' ? 'flex' : 'none';
        }

        function changeTheme(theme) {
            document.body.setAttribute('data-theme', theme);
        }

        function loadCustomFont(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const style = document.createElement('style');
                style.textContent = `@font-face { font-family: 'CustomFont'; src: url('${e.target.result}'); }`;
                document.head.appendChild(style);
                document.body.style.fontFamily = 'CustomFont';
            };
            reader.readAsDataURL(file);
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projects[currentProjectIndex]));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", "pages.data");
            dl.click();
        }

        function createNewProject() {
            const name = prompt("Nom du nouveau livre :");
            if(name) {
                projects.push({id: Date.now(), title: name, pages: [{title:'Nouvelle Page', content:'', img:'', layout:'top'}]});
                renderProjects();
            }
        }

        function renderProjects() {
            const list = document.getElementById('projectList');
            list.innerHTML = '';
            projects.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = 'nav-item';
                div.textContent = p.title;
                div.onclick = () => { currentProjectIndex = i; showSection('editor'); };
                list.appendChild(div);
            });
        }
        
        renderProjects();
    </script>
</body>
</html>
